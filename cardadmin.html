            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
            font-weight: bold;
        }

        button {
            background: #e67e22;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #d35400;
            transform: translateY(-2px);
        }

        button.secondary-btn {
            background: #7f8c8d;
        }

        button.secondary-btn:hover {
            background: #95a5a6;
        }

        .password-display-area {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .password-text {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            color: #f1c40f;
            text-transform: lowercase;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        /* Dynamic Height Card Layout Styles */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            display: grid; /* Use grid layout to map both faces to identical spacing dimensions */
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            grid-area: 1 / 1 / 2 / 2; /* Force card faces to overlap directly in the exact same track slot */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            padding: 15px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border: 4px solid #333;
        }

        .card-header-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }

            padding: 4px 8px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-size: 0.75em;
            text-transform: uppercase;
        }

        .card-front img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .card-front p {
            font-size: 0.9em;
            margin: 5px 0 15px 0;
            line-height: 1.4;
            flex-grow: 1; /* Pushes points badges perfectly down evenly */
        }

        .card-back {
            transform: rotateY(180deg);
            background: #2c3e50;
            color: white;
            justify-content: center;
            border-color: #f1c40f;
        }

        .points-badge {
            background: #27ae60;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            align-self: center;

        }

            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 5px;
            border-radius: 5px;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .empty-message {
            text-align: center;
            font-style: italic;
            color: #ccc;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>

    // ===================================================================================

    function checkAuthOnLoad() {
        if (localStorage.getItem('adminDashboardAuth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
        }
    }

    function checkPassword() {
        const input = document.getElementById('adminPasswordInput').value;
        if (input === 'WHcards_') {
            localStorage.setItem('adminDashboardAuth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    }

      { unit: 2, name: "The Achaemenid Empire", description: "Founded by Cyrus the Great around 553 BCE. Worlds largest empire at the time. Was multicultural meaning it was tolerant of all the cultures and religions in the empire. Fell in 330 BCE to Alexander the Great", imageUrl: "https://i.pinimg.com/564x/59/3b/c5/593bc5e7f78931949f99bd3223f0f245.jpg", rarity: "Common", question: { question: "Darius I, one of the leaders of the Achaemenid Empire practiced Zoroastrianism. What is one aspect of Zoroastrianism?", options: ["It was a polytheistic religion, meaning its followers worshipped multiple gods", "It was a physiological way of running the empire through violence", "It was a monothetic religion, meaning its followers worshipped one god", "It was a culture full of Greek fighters"], answer: 2 } },
      { unit: 2, name: "The Roman Empire", description: "The Roman Empire began after the fall of the Republic and grew into one of the largest empires in history, known for its roads, aqueducts, laws, and culture influenced by Greece.", imageUrl: "https://photos.airmail.news/voi4nkw1f0z3y10w30zmlb9dc3ol-5ad21f0cda6205aebec0f1de0f413b2a.jpg", rarity: "Common", question: { question: "How did Rome change from a republic, where citizens elected leaders, into an empire ruled by powerful emperors?", options: ["Leaders like Julius Caesar took control during a weak period in the Republic", "The people voted to abolish the Senate and make Julius Caesar king for life", "Rome’s allies forced it to adopt an empire system to manage trade", "The Senate voluntarily handed over power to the Byzantine Empire"], answer: 0 } },
      { unit: 2, name: "Ancient Greece", description: "Athens was a Greek city-state known for creating the first direct democracy, where citizens voted on laws themselves.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/f/f1/Discurso_funebre_pericles.PNG?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original", rarity: "Rare", question: { question: "What made Ancient Athens unique compared to other ancient civilizations?", options: ["It had emperors who ruled for life", "It practiced only monarchy, with power passed from king to king", "It was the first empire to conquer all of Greece", "It was the birthplace of direct democracy, where citizens voted on laws"], answer: 3 } },
      { unit: 2, name: "The Great Schism", description: "The East-West Schism of 1054 (The Great Schism) split Christianity into the Roman Catholic Church in the West and the Eastern Orthodox Church in the East.", imageUrl: "https://breakinginthehabit.org/wp-content/uploads/2017/11/schism.jpg?w=1920", rarity: "Rare", question: { question: "What was the result of the Great Schism of 1054?", options: ["The Byzantine Empire fell to invading Germanic tribes", "Christianity split into the Roman Catholic and Eastern Orthodox churches", "The Pope was replaced by the Patriarch of Constantinople", "Christianity merged with Judaism to form a new faith"], answer: 1 } },
      { unit: 2, name: "Monotheism", description: "The belief in one God, seen in religions like Zoroastrianism, Judaism, Christianity, and Islam", imageUrl: "https://thumbs.dreamstime.com/b/index-finger-up-gesture-attention-business-monotheism-islam-pop-art-retro-style-60141980.jpg", rarity: "Rare", question: { question: "Which of the following religions practice monotheism?", options: ["Hinduism and Buddhism", "Judaism, Christianity, and Islam", "Ancient Greece and Rome", "Daoism and Confucianism"], answer: 1 } },
      { unit: 2, name: "Plato", description: "Plato was a Greek philosopher who founded the Academy and wrote about government, philosophy, and education.", imageUrl: "https://www.meisterdrucke.us/kunstwerke/1260px/Unbekannt_-_Plato_c428-c348_BC_Ancient_Greek_philosopher_-_%28MeisterDrucke-797988%29.jpg", rarity: "Legendary", question: { question: "Which achievement is Plato best known for?", options: ["Writing the first laws of Rome", "Leading Athens as its first democratic ruler", "Creating the Mandate of Heaven in China", "Founding the Academy, one of the first schools of higher learning"], answer: 3 } },

      // Unit 3 Cards
      { unit: 3, name: "Charlemange", description: "Charlemagne was a medieval king who united much of Western Europe and was crowned the first Holy Roman Emperor.", imageUrl: "https://cdn.britannica.com/50/209350-050-1CF0398A/oil-Charlemagne-limewood-collection-Albrecht-Durer-Nurnberg.jpg?w=400&h=300&c=crop", rarity: "Common", question: { question: "What did Charlemagne accomplish?", options: ["A Roman emperor who divided the empire into East and West.", "A Viking leader who conquered France.", "A king who united Western Europe and became the first Holy Roman Emperor.", "A Byzantine ruler who built the Hagia Sophia."], answer: 2 } },
      { unit: 3, name: "Manorialism", description: "Manorialism was the economic system of the Middle Ages where peasants worked the lord’s land in return for safety and housing.", imageUrl: "https://cdn11.bigcommerce.com/s-wpgom64n7v/images/stencil/1280x1280/products/2242/8343/ema1__94118.1546201746.png?c=2", rarity: "Common", question: { question: "What was the main purpose of manorialism during the Middle Ages?", options: ["To create a system of trade between kingdoms.", "To organize farming and provide protection on self-sufficient estates.", "To spread Christianity throughout Europe.", "To train knights for battle in the Crusades."], answer: 1 } },
      { unit: 3, name: "Magna Carta", description: "The Magna Carta was a document signed in 1215 that limited the power of the English king and established certain rights for nobles.", imageUrl: "https://hls.harvard.edu/wp-content/uploads/2022/05/011215_Magna_Carta_017_605.jpg", rarity: "Rare", question: { question: "What did the Magna Carta seek to accomplish?", options: ["To limit the power of the king and protect certain rights.", "To give the king unlimited power over his nobles.", "To unite England and France under one ruler.", "To establish the first English colony in the Americas."], answer: 0 } },
      { unit: 3, name: "Islamic Golden Age", description: "The Islamic Golden Age was a time when Muslim scholars made major advances in math, science, and culture.", imageUrl: "https://s3-us-west-2.amazonaws.com/courses-images/wp-content/uploads/sites/1745/2017/04/18185444/360px-Cheshm_manuscript.jpg", rarity: "Legendary", question: { question: "What was one major result of the Islamic Golden Age?", options: ["The destruction of ancient Roman libraries and universities.", "Knowledge and ideas spread across three continents through trade and learning centers.", "The rise of feudalism in Eastern Europe.", "The end of trade along the Silk Road."], answer: 1 } },
      { unit: 3, name: "Suleiman the Magnificent", description: "Suleiman the Magnificent was the most famous sultan of the Ottoman Empire, known for expanding its territory and strengthening its laws.", imageUrl: "https://th-thumbnailer.cdn-si-edu.com/0Pi535Do6B-IO77H27229ysZHEY=/fit-in/1600x0/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer/e9/d5/e9d5d756-c7d1-4b06-8670-76d119f1fd4e/42-57988375.jpg", rarity: "Rare", question: { question: "Under which leader did the Ottoman Empire reach its greatest size and power?", options: ["Osman I", "Mehmed the Conqueror", "Suleiman the Magnificent", "Muhammad"], answer: 2 } },
      { unit: 3, name: "Fourth Crusade", description: "The Fourth Crusade was different from earlier ones because it never reached the Holy Land and instead attacked Constantinople.", imageUrl: "https://www.worldhistory.org/uploads/images/8052.jpg", rarity: "Common", question: { question: "What made the Fourth Crusade different from the earlier Crusades?", options: ["It never reached the Holy Land and attacked a Christian city instead.", "It was the only Crusade led entirely by kings.", "It was the first Crusade to capture Jerusalem.", "It was fought mainly in North Africa."], answer: 0 } },
      { unit: 3, name: "Danse Macabre", description: "The Danse Macabre, or the Dance of Death, was a medieval art theme showing that death comes for everyone, rich or poor, inspired by the events and destruction of the Black Death.", imageUrl: "https://onartandaesthetics.com/wp-content/uploads/2016/10/danse_macabrebernt_notke_-e1477246104907.jpg", rarity: "Common", question: { question: "What idea did the Danse Macabre represent in medieval art?", options: ["That only the wealthy could escape death.", "That the Black Death spared most of Europe.", "That art should only focus on religion.", "That death is a great equalizer affecting all people."], answer: 3 } },
      { unit: 3, name: "Gold-Salt trade", description: "The Gold-Salt Trade connected West Africa with North Africa, exchanging West African gold for North African salt and helping powerful kingdoms like Mali grow rich.", imageUrl: "https://static.cambridge.org/binary/version/id/urn:cambridge.org:id:binary-alt:20171108063105-49330-mediumThumb-19699fig6_1.jpg?pub-status=live", rarity: "Common", question: { question: "Which trade network was most responsible for the rise of powerful West African empires like Ghana and Mali?", options: ["The Silk Road", "The Gold-Salt trade", "The Mediterranean triangle", "The Indian Ocean trade"], answer: 1 } },
      { unit: 3, name: "Mayan Calendar", description: "The Maya developed an advanced calendar system based on astronomy and mathematics to track time and plan religious events.", imageUrl: "https://www.webexhibits.org/calendars/imagesFolder/images2009/shutterstock1830582.jpg", rarity: "Common", question: { question: "What was the purpose of the Mayan calendar?", options: ["To schedule trade with other civilizations", "To predict invasions from neighboring empires", "To track time and guide religious and agricultural events", "To measure the length of a ruler’s reign"], answer: 2 } },
      { unit: 3, name: "Kublai Khan", description: "Kublai Khan was a Mongol emperor who expanded his grandfather Genghis Khan’s empire and ruled China during the Yuan Dynasty.", imageUrl: "https://ingliando.net/wp-content/uploads/2024/12/kublai-khan.jpg?w=700", rarity: "Rare", question: { question: "He opened China to foreign trade and influence under Mongol rule", options: ["He opened China to foreign trade and influence under Mongol rule", "He ended trade with other regions to protect China’s culture", "He restored the power of the Song Dynasty", "He converted China completely to Mongol traditions"], answer: 0 } },
      { unit: 3, name: "Terrace Farming", description: "Terrace farming is a method of growing crops on stepped hillsides to prevent erosion and make mountain land usable for agriculture.", imageUrl: "https://mayorgacoffee.com/cdn/shop/articles/Ancient_innovators__We_ve_all_learnt_from_the_Incas.jpg?v=1692173518", rarity: "Common", question: { question: "Why did civilizations like the Inca use terrace farming?", options: ["To transport water between rivers and valleys", "To decorate mountains for religious ceremonies", "To create more farmland on steep mountain slopes", "To build defense walls against enemies"], answer: 2 } },
      { unit: 3, name: "Tenochtitlan", description: "Tenochtitlan was the capital city of the Aztec Empire, built on an island in Lake Texcoco and known for its canals, temples, and advanced engineering.", imageUrl: "https://sciencemadefun.net/blog/wp-content/uploads/2020/09/El_templo_mayor_en_Tenochtitlan.png", rarity: "Common", question: { question: "What was significant about the city of Tenochtitlan?", options: ["It was the first European colony in the Americas", "It was the Aztec capital built on a lake with canals and temples", "It was the main trading city of the Inca Empire", "It was destroyed by earthquakes before the Spanish arrived"], answer: 1 } },
      { unit: 3, name: "Paiza", description: "A paiza was a tablet or pass used in the Mongol Empire that gave officials and messengers the right to travel safely and receive supplies across the empire.", imageUrl: "https://citizenshipbyinvestment.news/wp-content/uploads/2019/04/paiza.jpg", rarity: "Common", question: { question: "What was the purpose of a golden passport in the Mongol Empire? This was given to Niccolò and Maffeo Polo by Great Khan.", options: ["To record taxes collected from conquered lands", "To identify soldiers during battle.", "To serve as a form of currency for trade", "To allow safe travel and protection across the Mongol Empire"], answer: 3 } },

      // Unit 4 Cards
      { unit: 4, name: "Chinese treasure voyages", description: "Voyages were seven massive naval expeditions led by Admiral Zheng He in the early 1400s Ming Dynasty to project Chinese power and secure tribute from states across the Indian Ocean, reaching as far as Arabia and Africa.", imageUrl: "https://cdn.britannica.com/35/205235-050-8E08D431/Zheng-He-fleet-postage-stamp-Chinese.jpg", rarity: "Common", question: { question: "Who was the admiral that led the famous Chinese treasure voyages during the Ming Dynasty?", options: ["Kublai Khan", "Yongle Emperor", "Zheng He", "Marco Polo"], answer: 2 } },
      { unit: 4, name: "The Forbidden City", description: "The Forbidden City in Beijing was the massive imperial palace for 24 emperors of the Ming and Qing dynasties from 1420 to 1912, and commoners were barred from entering.", imageUrl: "https://static.toiimg.com/thumb/68065207.cms?resizemode=75&width=1200&height=900", rarity: "Common", question: { question: "For which major dynasty did the Forbidden City serve as the imperial palace?", options: ["Ming", "Song", "Tang", "CCP"], answer: 0 } },
      { unit: 4, name: "The Three Gs", description: "The three Gs were the primary motivations for European exploration during the Age of Discovery. They stand for: Gold God and Glory", imageUrl: "https://cdn11.bigcommerce.com/s-wpgom64n7v/images/stencil/1280x1280/products/12009/47456/3gtitle__59682.1591665077.JPG?c=2", rarity: "Rare", question: { question: "Which of the following is NOT considered one of the three Gs of European exploration?", options: ["Gold", "Glory", "Geography", "God"], answer: 2 } },
      { unit: 4, name: "Astrolabe", description: "An ancient instrument used by sailors to navigate. By measuring the angle of the Sun or the North Star above the horizon, a navigator could determine their latitude (their north-south position on Earth).", imageUrl: "https://www.universetoday.com/article_images/405px-Astrolabium.jpg", rarity: "Common", question: { question: "What was the primary use of an astrolabe during the Age of Exploration?", options: ["To measure speed", "To determine longitude (east and west)", "To determine latitude (north and south)", "To predict the weather"], answer: 2 } },
      { unit: 4, name: "The Middle Passage", description: "Horrific and forced voyage of enslaved Africans across the Atlantic Ocean to the Americas. It was the middle leg of the Triangular Trade route, and millions died during the journey from brutal conditions, disease, and overcrowding on the ships.", imageUrl: "https://www.nps.gov/articles/images/Middle-Passage-Map-Final-reduced-size.jpg", rarity: "Rare", question: { question: "The Middle Passage was the leg of the Triangular Trade that carried which of the following?", options: ["Manufactured goods", "Spices and silk from Asia to Europe", "Raw materials", "Enslaved People from Africa to the Americas."], answer: 3 } },
      { unit: 4, name: "Freedom's Journal", description: "The first newspaper in the United States to be owned and operated by African Americans. Based in New York City, its editors, Samuel E. Cornish and John B. Russwurm, created it to counter racist press and to plead our own cause.", imageUrl: "https://media.sellfy.store/images/XYYvNJ9z/oxaf4x3oz1QHzllePk5N/TYAmroohG7.jpeg", rarity: "Common", question: { question: "What is the primary historical significance of Freedom's Journal?", options: ["It was the first newspaper in America to be published daily.", "It was the first newspaper owned and operated by African Americans.", "It was the first newspaper to be banned in the Southern states.", "It was the first newspaper to be published in a foreign language."], answer: 1 } },
      { unit: 4, name: "British East India Company", description: "Founded in 1600, it was an immensely powerful private trading corporation. It was granted a monopoly on trade with India, where it eventually built its own private army and took over as the de facto government, ruling large parts of the subcontinent until 1858.", imageUrl: "https://primalderma.com/wp-content/uploads/2020/06/2e07dbc9743dc0cd58fb37a5a4b7d424.jpg.webp", rarity: "Rare", question: { question: "Which event caused the British government to end the East India Company's rule and take direct control of India?", options: ["The Indian Rebellion of 1857", "The Battle of Plassey", "The start of the Opium Wars", "The American Revolution"], answer: 0 } },
      { unit: 4, name: "Akbar the Great", description: "Reigned from 1556 to 1605 he was the third and most celebrated emperor of India's Mughal Empire. He is famous for vastly expanding the empire and for his policy of religious tolerance, which included abolishing the special tax on non-Muslims and inviting scholars of all faiths to his court.", imageUrl: "https://sweetinstitute.com/wp-content/uploads/2024/05/Depositphotos_708959358_S.jpg", rarity: "Rare", question: { question: "What was the family relationship between Babur, the founder of the Mughal Empire, and Akbar the Great?", options: ["Babur was Akbar's father.", "Babur was Akbar's great-grandfather.", "Babur was Akbar's uncle.", "Babur was Akbar's grandfather."], answer: 3 } },
      { unit: 4, name: "Dutch East India Company", description: "Known as the VOC, it was founded in 1602 and is often called the world's first multinational corporation. It was granted a 21-year monopoly on the Dutch spice trade in Asia and was given unique, quasi-governmental powers, including the right to wage war, build forts, and establish colonies.", imageUrl: "https://i.ytimg.com/vi/U5jbEkX0L_4/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAUuau1rCYPL1VUslc1T4mNBNtW5w", rarity: "Common", question: { question: "Besides trade, what was one of the unique powers granted to the Dutch East India Company (VOC) by its charter?", options: ["The right to elect members of the Dutch Parliament.", "The right to determine the official religion of the Netherlands.", "The right to wage war, make treaties, and establish colonies.", "The right to mint currency for all of Europe."], answer: 2 } },
      { unit: 4, name: "Japan's Warring States period", description: "The Sengoku Jidai (1467-1603) was a century of constant civil war in Japan. The central government collapsed, and powerful warlords called daimyo (feudal lords) fought each other for control of the country.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/a/a6/Sengoku_period_battle.jpg", rarity: "Legendary", question: { question: "Who is known as the first of the clan leader who began the process of ending Japan's Warring States period?", options: ["Tokugawa Ieyasu", "Oda Nobunaga", "Toyotomi Hideyoshi", "Minamoto Yoritomo"], answer: 1 } },
      { unit: 4, name: "Treaty of Tordesillas", description: "An agreement between Spain and Portugal, mediated by the Pope, that drew an imaginary vertical line through the Atlantic Ocean. This line divided the newly discovered lands of the New World between them: Spain got the lands to the west (most of the Americas), and Portugal got the lands to the east (including Brazil).", imageUrl: "https://samepassage.org/wp-content/uploads/2020/08/Treaty-of-Tordesillas.jpg", rarity: "Common", question: { question: "The Treaty of Tordesillas (1494) was an agreement between which two European powers to divide newly discovered lands?", options: ["The Netherlands and England", "England and France", "Portugal and the Ottoman Empire", "Spain and Portugal"], answer: 3 } },
      { unit: 4, name: "Roanoke Colony", description: "England's first attempt at a permanent settlement in North America. Known as the Lost Colony, the entire population vanished when Governor John White returned in 1590 after a long delay.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTM3dMgtz1ljEiOkHeh6qy2srWoGN4iDvIBaA&s", rarity: "Rare", question: { question: "When Governor John White returned to the abandoned Roanoke Colony in 1590, what was the single, mysterious clue he found carved into a post?", options: ["JAMESTOWN", "CROATOAN", "SPAIN", "MAYFLOWER"], answer: 1 } },
      { unit: 4, name: "Juan Ponce de León", description: "A Spanish conquistador who became the first governor of Puerto Rico. In 1513, he led the first official European expedition to Florida, a land he named La Florida", imageUrl: "https://npr.brightspotcdn.com/dims4/default/63778b2/2147483647/strip/true/crop/302x251+0+0/resize/880x731!/quality/90/?url=http%3A%2F%2Fnpr-brightspot.s3.amazonaws.com%2F56%2F37%2F8058dd07443ba6cd27f274e0f7e9%2Fde-leon.2%20%281%29.jpg", rarity: "Rare", question: { question: "Which modern-day U.S. state did Juan Ponce de León discover after landing there in 1513?", options: ["California", "Georgia", "Florida", "Texas"], answer: 2 } },
      { unit: 4, name: "Circumnavigation of The World", description: "To circumnavigate the world means to travel completely around the entire globe (in a circle) and return to the starting point. The first expedition to ever achieve this was led by Ferdinand Magellan (and completed by Juan Sebastián Elcano) from 1519 to 1522.", imageUrl: "https://penntoday.upenn.edu/sites/default/files/2019-09/map_cover.jpg", rarity: "Common", question: { question: "Which explorer led the first expedition to successfully circumnavigate the Earth?", options: ["Ferdinand Magellan", "Vasco da Gama", "Christopher Columbus", "Hernán Cortés"], answer: 0 } },

      // Unit 5 Cards
      { unit: 5, name: "The Printing Press", description: "Invented by Johannes Gutenberg around 1440, the printing press used movable type to mass produce books. This invention dramatically lowered the cost of reading materials and fueled the rapid spread of knowledge across Europe.", imageUrl: "https://miro.medium.com/0*sa_LtT713hTbzRKc.jpg", rarity: "Common", question: { question: "Who is credited with inventing the movable type printing press in Europe, which allowed for the mass production of books?", options: ["Leonardo da Vinci", "Johannes Gutenberg", "Martin Luther", "Isaac Newton"], answer: 1 } },
      { unit: 5, name: "Leonardo da Vinci", description: "The ultimate Renaissance Man, he was a painter, inventor, scientist, and engineer. He is best known for painting the Mona Lisa and The Last Supper, as well as for his sketches of flying machines and human anatomy.", imageUrl: "https://media.cnn.com/api/v1/images/stellar/prod/190430054229-02-leonardo-da-vinci-hair-lock.jpg?q=w_2000,c_fill", rarity: "Rare", question: { question: "Because of his expertise in art, science, engineering, and anatomy, Leonardo da Vinci is often referred to as the ultimate example of what term?", options: ["The Absolute Monarch", "The Enlightened Despot", "The Renaissance Man", "The Medieval Knight"], answer: 2 } },
      { unit: 5, name: "95 Theses", description: "A document written by the German monk Martin Luther in 1517 that openly questioned the authority of the Pope and the Catholic Church. Its publication is widely considered the spark that started the Protestant Reformation, leading to a permanent split in European Christianity.", imageUrl: "https://blogs.thegospelcoalition.org/justintaylor/files/2010/10/Luther-nailing-theses-560x538.jpg", rarity: "Common", question: { question: "The posting of the 95 Theses begins which major religious movement in Europe?", options: ["The Counter-Reformation", "The Spanish Inquisition", "The Great Schism", "The Protestant Reformation"], answer: 3 } },
      { unit: 5, name: "The Council of Trent", description: "A series of meetings that served as the Catholic Church's official response to the Protestant Reformation. The Council reaffirmed Catholic doctrines while simultaneously reforming corrupt practices, such as banning the sale of indulgences.", imageUrl: "https://cdn.britannica.com/71/189471-050-E0B9E1D3/session-Council-of-Trent-Nicolo-Dorigati-Trento-1711.jpg", rarity: "Common", question: { question: "The Council of Trent is most associated with which major historical movement?", options: ["The Counter-Reformation", "The Scientific Revolution", "The Enlightenment", "he Crusades"], answer: 0 } },
      { unit: 5, name: "Heliocentric Theory", description: "Proposed by Nicolaus Copernicus in 1543, this is the scientific model stating that the Sun is at the center of the universe (or solar system), and that the Earth and other planets revolve around it. This idea directly challenged the ancient geocentric model, which claimed the Earth was the center of everything.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/5/57/Heliocentric.jpg", rarity: "Rare", question: { question: "Which astronomer is credited with starting the Scientific Revolution by publishing the Heliocentric (Sun-centered) theory?", options: ["Isaac Newton", "Ptolemy", "Nicolaus Copernicus", "Aristotle"], answer: 2 } },
      { unit: 5, name: "Isaac Newton", description: "an English mathematician and physicist who is often considered the most influential scientist of all time. He defined the laws of motion and the law of universal gravitation, explaining that the same force that makes an apple fall also keeps the planets in orbit.", imageUrl: "https://cdn.britannica.com/84/182384-050-E6EC1625/prism-Isaac-Newton-sunlight-experiment-band-colors.jpg", rarity: "Common", question: { question: "Which scientist is best known for formulating the three laws of motion and the law of universal gravitation?", options: ["Albert Einstein", "Nicolaus Copernicus", "Isaac Newton", "Galileo Galilei"], answer: 2 } },
      { unit: 5, name: "Enlightened Despots", description: "18th-century absolute monarchs who were inspired by Enlightenment ideas. They used their supreme power to implement reforms like religious tolerance, legal justice, and education, but they refused to give up any of their political control or allow democracy.", imageUrl: "https://i0.wp.com/image.slidesharecdn.com/unit3-141008041317-conversion-gate02/95/the-ancient-regime-and-its-transformation-65-638.jpg", rarity: "Rare", question: { question: "Which statement best describes how an Enlightened Despot rules?", options: ["They were leaders who were elected by a popular vote of the citizens.", "They banned all books and philosophy to keep their populations ignorant.", "They voluntarily stepped down from the throne to establish a democracy.", "They used their absolute power to implement political and social reforms based on Enlightenment principles."], answer: 3 } },
      { unit: 5, name: "Natural Rights", description: "Famously developed by the philosopher John Locke. He argued that all humans are born with certain rights that no government can take away: Life, Liberty, and Property. If a government fails to protect these rights, Locke argued that the people have the right to overthrow it.", imageUrl: "https://www.worldhistory.org/img/r/p/500x600/18469.png?v=1707732852", rarity: "Legendary", question: { question: "According to John Locke, what are the three natural rights that all people possess?", options: ["Liberty, Equality, and Fraternity", "Life, Liberty, and the Pursuit of Happiness", "Life, Liberty, and Property", "Faith, Hope, and Charity"], answer: 2 } },
      { unit: 5, name: "King Henry VIII", description: "Reigned 1509 to 1547, he is best known for having six wives and for breaking England away from the Catholic Church. When the Pope refused to grant him a divorce from his first wife, Henry declared himself the Supreme Head of the Church of England (Act of Supremacy), starting the English Reformation.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/1491_Henry_VIII.jpg/960px-1491_Henry_VIII.jpg", rarity: "Common", question: { question: "What was the main political and personal reason King Henry VIII broke away from the Roman Catholic Church?", options: ["He wanted to divorce from his first wife to marry Anne Boleyn", "He wanted to abolish all religion in England", "He wanted to form an alliance with the Ottoman Empire", "He disagreed with the Catholic Church's use of Latin in mass"], answer: 0 } },
      { unit: 5, name: "Renaissance Artwork", description: "Focuses on realism and the human form, inspired by ancient Greece and Rome. Artists like Michelangelo and Raphael began to focus on human potential, realistic anatomy, and individual emotion, moving away from the flat, symbolic styles of the Middle Ages.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Raffaello_-_Spozalizio_-_Web_Gallery_of_Art.jpg/500px-Raffaello_-_Spozalizio_-_Web_Gallery_of_Art.jpg", rarity: "Common", question: { question: "Raphael's famous painting, The School of Athens, pays tribute to the Renaissance revival of knowledge from which two ancient civilizations?", options: ["China and India", "Egypt and Mesopotamia", "The Maya and Aztec", "Greece and Rome"], answer: 3 } },
      { unit: 5, name: "Voltaire", description: "A French Enlightenment philosopher known for his sharp wit and biting satire. He was a crusader against intolerance, censorship, and religious persecution, famously fighting for freedom of speech and freedom of religion.", imageUrl: "https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1345060082i/19380.jpg", rarity: "Rare", question: { question: "Voltaire is most famous for his defense of which set of Enlightenment idea?", options: ["Freedom of speech and religious tolerance", "The right to bear arms and form a militia", "The right to women voting", "The right to own private property"], answer: 0 } },

      // Unit 6 Cards
      { unit: 6, name: "The Golden Stool", description: "Holds immense spiritual power. According to legend, the High Priest Okomfo Anokye summoned it from the sky to land on the lap of the first king. It is the source of the kingdom's unity; if the stool were ever destroyed or captured, the Ashanti believe their nation would cease to exist.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/The_Childrens_Museum_of_Indianapolis_-_Queen_Mothers_stool.jpg/250px-The_Childrens_Museum_of_Indianapolis_-_Queen_Mothers_stool.jpg", rarity: "Common", question: { question: "According to Ashanti tradition, what is the primary source of the Golden Stool's power?", options: ["It is made of solid diamonds from the mines of Sierra Leone.", "It contains the spirit and soul of the Ashanti people.", "It was a gift from the Queen of England that grants British protection.", "It allows the user to speak directly to animals."], answer: 1 } },
      { unit: 6, name: "King Nzinga-a-Nkuwu", description: "The ruler of the powerful Kingdom of Kongo in Central Africa. After encountering Portuguese explorers in the late 1400s, he voluntarily converted to Roman Catholicism in 1491 to strengthen trade and political ties with Portugal. Upon his baptism, he changed his name to King João I.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/e/ee/Jean_Roy_de_Congo.jpg", rarity: "Common", question: { question: "In 1491, King Nzinga-a-Nkuwu converted to Christianity and changed his name to João I after contact with which European nation?", options: ["The Netherlands", "Spain", "Portugal", "Great Britain"], answer: 2 } },
      { unit: 6, name: "Tokugawa Shogunate", description: "The final feudal government of Japan, founded by Tokugawa Ieyasu (the third unifier). It moved the capital to Edo (modern-day Tokyo) and ushered in over 250 years of peace and stability. To maintain control, the shoguns enforced a strict class system and a policy of national isolation, banning Christianity and restricting trade with the outside world.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/1/11/Tokugawa_Ieyasu2.JPG", rarity: "Rare", question: { question: "The Edo period in Japan brought a period of what to Japan?", options: ["Peace", "War", "Chaos", "Travel"], answer: 0 } },
      { unit: 6, name: "Ukiyo-e", description: "A genre of Japanese art that flourished during the Edo period. These were primarily woodblock prints that depicted the pleasures of urban life: kabuki actors, sumo wrestlers, beautiful courtesans, and landscapes. Because they were printed from carved wood blocks, they could be mass-produced and sold cheaply to the rising middle class.", imageUrl: "https://palmermuseum.psu.edu/wp-content/uploads/2021/10/UKIYO-E_75_84-copy.jpg", rarity: "Common", question: { question: "What artistic technique was primarily used to create Ukiyo-e, allowing these colorful images to be mass-produced?", options: ["Fresco painting", "Marble sculpture", "Oil painting on canvas", "Woodblock printing"], answer: 3 } },
      { unit: 6, name: "Spanish Armada", description: "A massive fleet of 130 ships sent by King Philip II of Spain in 1588 to invade England. His goal was to overthrow Queen Elizabeth I and restore Catholicism. English victory led to a crushing defeat for Spain.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/4/45/Loutherbourg-Spanish_Armada.jpg", rarity: "Rare", question: { question: "Which country is credited with defeating the Spanish Armada in 1588, effectively halting Spain's attempt at an invasion?", options: ["Portugal", "England", "The Netherlands", "France"], answer: 1 } },
      { unit: 6, name: "Louis XIV", description: "Monarch of France from 1643-1715, known as the Sun King, he is the ultimate example of an absolute monarch. He famously centralized all power in himself, reportedly saying, L etat, c est moi meaning I am the state.", imageUrl: "https://i0.wp.com/thegoodlifefrance.com/wp-content/uploads/2025/07/Louis-XIV.webp?ssl=1", rarity: "Common", question: { question: "What was the major negative economic consequence of King Louis XIV's reign?", options: ["His massive spending on wars and palaces left France deeply in debt.", "He refused to spend money on the arts, causing French culture to decline.", "He gave all the royal land away to the peasants.", "He abolished all taxes, leaving the government with no income."], answer: 0 } },
      { unit: 6, name: "Zheng Yi Sao", description: "The most successful pirate in history. She commanded over 40,000 pirates and hundreds of ships, terrorizing the South China Sea. She was so powerful that the Chinese government couldn't defeat her and eventually offered her a peaceful retirement.", imageUrl: "https://lh6.googleusercontent.com/proxy/HznpozGiKBU93hgYWZ8jvurn8IEJbXzNi8sLPycENih4SBrzdNOgA3sn-kcFxRmjcaQDNRZ9mu-P7OV9bRL2ZFY81CQeFKiKd-FYYQcpQqRUBL62UyclwQdl8OwSKeUFdQ", rarity: "Common", question: { question: "Zheng Yi Sao is unique among famous historical pirates because", options: ["She was the first pirate to sail around the world", "She was defeated and executed by the British Navy", "She only attacked ships carrying gold", "She successfully and peacefully retired with her wealth"], answer: 3 } },
      { unit: 6, name: "Privateers", description: "Essentially legal pirates, they were private ship captains authorized by their government (via a document called a Letter of Marque) to attack and plunder enemy merchant ships during wartime. Famous pirates started as privateers before the line between privateer and pirate blurred.", imageUrl: "https://www.marinersmuseum.org/wp-content/uploads/2012/09/BLACKBEARD-CARICATURE1-1.jpg", rarity: "Rare", question: { question: "What was the key legal difference between a pirate and a privateer?", options: ["Privateers only attacked ships at night", "Privateers were not allowed to use cannons.", "Privateers held a Letter of Marque authorizing their attacks", "Privateers gave 100% of their loot to the poor."], answer: 2 } },
      { unit: 6, name: "First Continental Congress", description: "In 1774, delegates from 12 colonies met in Philadelphia to protest the Intolerable Acts. They did not declare independence yet; instead, they created they spoke about enforcing a strict boycott of all British goods until their rights were restored.", imageUrl: "https://www.bostonteapartyship.com/wp-content/uploads/2019/09/first-continental-congress-1.jpg", rarity: "Rare", question: { question: "What was the main goal of the First Continental Congress when they met in 1774?", options: ["To organize a diplomatic response to all the acts being imposed upon them", "To declare immediate independence from Great Britain", "To ratify the United States Constitution", "To elect George Washington as the first President"], answer: 0 } },
      { unit: 6, name: "Articles of Confederation", description: "The first constitution of the United States in 1777. Because the Founders feared a powerful tyrant like King George, they intentionally created a weak central government. There was no President, no national court system, and Congress did not have the power to force states to pay taxes.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGgZBYyJ11DYDAqj2XotDPzrgb_MBmiT42bA&s", rarity: "Common", question: { question: "What was the main weakness of the Articles of Confederation that led to its failure?", options: ["The President had too much power and acted like a King", "It forced all thirteen states to follow the exact same religion", "The Supreme Court kept overturning laws passed by the states", "The states had too much power and the central government could not tax"], answer: 3 } },
      { unit: 6, name: "Tennis Court Oath", description: "An important moment in the beginning of the French Revolution in 1789. After being locked out of their meeting hall by King Louis XVI, members of the Third Estate (representing the common people) gathered in a nearby indoor tennis court. There, they swore a solemn oath never to separate until they had written a new Constitution for France.", imageUrl: "https://www.carnavalet.paris.fr/sites/default/files/styles/1200x/public/collectionlpdp_35984-17.jpg?itok=-ADhA_5v", rarity: "Common", question: { question: "In the Tennis Court Oath, the members of the Third Estate (declaring themselves the National Assembly) vowed not to disband until they had achieved which goal?", options: ["The execution of King Louis XVI and Marie Antoinette", "The successful storming of the Bastille prison", "The drafting of a new written constitution for France", "The expulsion of all Catholic priests from the country"], answer: 2 } },
      { unit: 6, name: "Maximilien Robespierre", description: "A radical leader during the French Revolution who took control of the Committee of Public Safety. He is best known for orchestrating the Reign of Terror, a bloody period where thousands of people accused of being enemies of the revolution were executed by the guillotine. Eventually, the people turned against him, and he was executed by the same machine he used on so many others.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/1870_Max_Adamo_Der_Sturz_des_Robespierre_anagoria.jpg/330px-1870_Max_Adamo_Der_Sturz_des_Robespierre_anagoria.jpg", rarity: "Common", question: { question: "Maximilien Robespierre was the leading figure behind which violent period of the French Revolution?", options: ["The Reign of Terror", "The Great Fear", "The Directory", "The Napoleonic Wars"], answer: 0 } },
      { unit: 6, name: "Napoleons Return from Elba, Hundred Days", description: "Dramatic period in 1815 when Napoleon Bonaparte escaped from his exile on the island of Elba and returned to France. He quickly regained support from the army and the French people, forcing King Louis XVIII to flee. This brief second reign ended with his final defeat at the Battle of Waterloo, after which he was exiled permanently to the remote island of St. Helena.", imageUrl: "https://library.brown.edu/cds/askb/waterloo/img/waterloohundred01.jpg", rarity: "Legendary", question: { question: "Which famous battle marked the end of Napoleon's Hundred Days return to power?", options: ["The Invasion of Russia", "The Battle of Austerlitz", "The Battle of Waterloo", "The Battle of Trafalgar"], answer: 2 } },
      { unit: 6, name: "The Continental System", description: "Napoleon's attempt to defeat Great Britain through economic warfare. Since he could not defeat the British Navy at sea, he ordered all European nations under his control to stop trading with Britain (a massive blockade).", imageUrl: "https://www.napoleon.org/wp-content/thumbnails/uploads/2019/08/lecture_du_decret_imperial_faite_-_btv1b6941180n-tt-width-637-height-487-crop-1-bgcolor-ffffff-lazyload-0.jpeg", rarity: "Common", question: { question: "What was the primary goal of Napoleon's Continental System?", options: ["To destroy Great Britain's economy by banning trade with the British", "To create a single currency for all of Europe", "To build a bridge connecting France and England", "To import cheap goods from the United States"], answer: 0 } },
      { unit: 6, name: "Toussaint Louverture", description: "The military leader of the Haitian Revolution (1791-1804). Born a slave, he rose to become the commander of the revolutionary army, successfully fighting off the French, Spanish, and British. He was captured by the French and died in prison, his efforts paved the way for Haiti to become the first independent black republic in the world.", imageUrl: "https://cdn.britannica.com/66/215366-138-C9BE795B/Top-questions-answers-Toussaint-Louverture.jpg?w=800&h=450&c=crop", rarity: "Common", question: { question: "Toussaint Louverture is best known for leading the only successful slave revolt in history, which resulted in the independence of which country?", options: ["Haiti", "Jamaica", "Cuba", "Brazil"], answer: 0 } },
      { unit: 6, name: "Miguel Hidalgo", description: "A Mexican Catholic priest who is considered the father of the Mexican War of Independence. On September 16, 1810, he rang the bells of his church in the town of Dolores and gave a famous speech known as the Grito de Dolores (Cry of Dolores). He called on the indigenous people and mestizos to rise up against Spanish rule, launching a massive (though initially disorganized) rebellion.", imageUrl: "https://hips.hearstapps.com/hmg-prod/images/miguel-hidalgo-y-costilla-gettyimages-871633898-1x1.jpg?crop=1xw:0.75xh;center,top&resize=1200:*", rarity: "Rare", question: { question: "What is the significance of the Grito de Dolores started by Miguel Hidalgo in 1810?", options: ["It was a peace treaty signed between Mexico and Spain", "It was the speech where Hidalgo declared himself Emperor of Mexico.", "It started the rebellions that marked the beginning of the Mexican War of Independence", "t was the battle where the Mexican army defeated the French"], answer: 2 } },
      { unit: 6, name: "Libertadores", description: "Meaning Liberators, they were the military and political leaders who led the Latin American wars of independence against the Spanish Empire in the early 19th century. The two most famous figures were Simón Bolívar (who liberated the north) and José de San Martín (who liberated the south).", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/f/f3/Entrevista_de_Guayaquil.jpg", rarity: "Rare", question: { question: "Which two leaders are universally recognized as the primary Libertadores of South America?", options: ["Pancho Villa and Emiliano Zapata", "Christopher Columbus and Amerigo Vesvucci", "Hernán Cortés and Francisco Pizarro", "Simón Bolívar and José de San Martín"], answer: 3 } },
      { unit: 6, name: "Dom Pedro I", description: "Dom Pedro I was the son of the King of Portugal. When the Portuguese royal family returned to Europe after the Napoleonic Wars, Pedro stayed behind in Brazil. In 1822, he declared Brazil's independence. Instead of becoming a republic like its neighbors, Brazil became an Empire, and Pedro became its first Emperor.", imageUrl: "https://ferrebeekeeper.wordpress.com/wp-content/uploads/2016/08/portrait_of_dom_pedro_duke_of_braganc3a7a_-_google_art_project_edited.jpeg?w=584", rarity: "Common", question: { question: "How was the independence of Brazil primarily different from the independence movements in Spanish Latin America?", options: ["Brazil was the first nation to abolish slavery immediately upon independence", "Brazil fought a 20-year bloody war that killed half the population", "Brazil became a monarchy (Empire) ruled by the son of the Portuguese King, rather than a republic", "Brazil remained a colony of Portugal but was allowed to trade freely"], answer: 2 } },

      // Unit 7 Cards
      { unit: 7, name: "Crop Rotation", description: "The practice of planting different crops in the same field each year instead of the same crop over and over. This keeps the soil healthy and helps farmers grow better crops.", imageUrl: "https://cdn.prod.website-files.com/621e95f9ac30687a56e4297e/65dcfeff211dc9b868dbbe4d_V2_1705440236791_8f8dc7b4-caec-4de4-ab6d-9db494fc5a9a_HIGH_RES.png", rarity: "Common", question: { question: "How did crop rotation mainly help farmers during the Agricultural Revolution?", options: ["It kept the soil healthy by replacing nutrients", "It allowed farmers to plant seeds faster", "It helped machines harvest crops", "It reduced the need for sunlight"], answer: 0 } },
      { unit: 7, name: "Spinning Mule", description: "A machine that spun cotton into thread much faster than hand spinning. It allowed factories to produce large amounts of strong thread, helping the textile industry grow during the Industrial Revolution.", imageUrl: "https://img.reverso.net/dict/Spinning_Mule-noun-inventions-45877e16_1.webp", rarity: "Common", question: { question: "How did the spinning mule change textile production?", options: ["It replaced the use of cotton", "It slowed down cloth production", "It made thread stronger and faster than hand spinning", "It was used only in small homes"], answer: 2 } },
      { unit: 7, name: "Railroads", description: "Transportation systems that use trains to move people and goods long distances on tracks. During the Industrial Revolution, railroads made travel faster and cheaper and helped businesses send products to new markets.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/5/5d/East_and_West_Shaking_hands_at_the_laying_of_last_rail_Union_Pacific_Railroad_-_Restoration.jpg", rarity: "Rare", question: { question: "How did railroads affect industrialization?", options: ["They replaced factories", "They helped goods and people move faster and cheaper", "They made transportation slower", "They limited trade between cities"], answer: 1 } },
      { unit: 7, name: "Coal Mines", description: "Places where coal is dug out of the ground to be used as fuel. During the Industrial Revolution, coal powered factories, steam engines, and railroads, making industrial growth possible.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/FIRST_SHIFT_OF_MINERS_AT_THE_VIRGINIA-POCAHONTAS_COAL_COMPANY_MINE_%5E4_NEAR_RICHLANDS%2C_VIRGINIA%2C_LEAVING_THE_ELEVATOR...._-_NARA_-_556393_tweaked.jpg/1280px-FIRST_SHIFT_OF_MINERS_AT_THE_VIRGINIA-POCAHONTAS_COAL_COMPANY_MINE_%5E4_NEAR_RICHLANDS%2C_VIRGINIA%2C_LEAVING_THE_ELEVATOR...._-_NARA_-_556393_tweaked.jpg", rarity: "Common", question: { question: "Why were coal mines important during the Industrial Revolution?", options: ["They powered factories, machines, and engines", "They provided food for workers", "They replaced farming jobs", "They reduced the need for transportation"], answer: 0 } },
      { unit: 7, name: "Strike", description: "When workers stop working to protest for better pay, hours, or working conditions. Strikes were used to pressure employers to listen to workers' demands.", imageUrl: "https://exhibitions.lib.umd.edu/binaries/content/gallery/exhibits/unions/social-rights/womens-rights/labor_m3panel1_women_triangleprotest1911.jpg", rarity: "Common", question: { question: "Why did workers go on strike during the Industrial Revolution?", options: ["To close factories permanently", "To take a vacation", "To protest for better pay and working conditions", "To build new machines"], answer: 2 } },
      { unit: 7, name: "Industrialists", description: "People who owned or managed large factories and businesses during the Industrial Revolution. They made money by producing goods on a large scale and often influenced how industries and cities grew.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1c5Xtq_S4C8w50SUtwe9NUjxKZV1SuIgOVQ&s", rarity: "Common", question: { question: "Who were industrialists during the Industrial Revolution?", options: ["Owners of large factories", "Workers who went on strike", "People who lived on farms", "Government officials who made laws"], answer: 0 } },
      { unit: 7, name: "Tenements", description: "Crowded, often unsafe apartment buildings where many working-class families lived during the Industrial Revolution. They were usually poorly built, with little sunlight or clean water.", imageUrl: "https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2152707459/settings_images/16df6b-4ef-754-5208-87db87401332_tenement_building_industrial.jpg", rarity: "Rare", question: { question: "Why were tenements a problem during the Industrial Revolution?", options: ["They were too expensive for workers", "They were only used by factory owners", "They were located far from cities", "They were crowded and unhealthy"], answer: 3 } },
      { unit: 7, name: "Urbanization", description: "The process of people moving from rural areas to cities. During the Industrial Revolution, cities grew quickly as workers moved closer to factories, which led to crowded living conditions and new city problems.", imageUrl: "https://studentmadehistory.wordpress.com/wp-content/uploads/2015/05/f81cc368-cbc7-ab07-5da7-595b97636bf2.jpg", rarity: "Common", question: { question: "Why did urbanization increase during the Industrial Revolution?", options: ["Factories in cities created jobs for workers", "More people wanted to live on farms", "Cities had fewer problems than the countryside", "People wanted to avoid schools"], answer: 0 } },
      { unit: 7, name: "Miasma (Bad Air)", description: "The old belief that diseases were caused by bad air or unpleasant smells. Before scientists understood germs, people thought breathing this air made them sick.", imageUrl: "https://surgeonshallmuseums.wordpress.com/wp-content/uploads/2024/10/m992x.5.82.jpeg", rarity: "Common", question: { question: "What did people believe caused disease under the miasma theory?", options: ["Bad air or unpleasant smells", "Germs in water", "Eating too much food", "Sunlight and fresh air"], answer: 0 } },
      { unit: 7, name: "Telegraph", description: "A machine that sent messages quickly over long distances using electrical signals and Morse code. It helped people communicate faster than ever before, which was important for business, news, and railroads.", imageUrl: "https://media.sciencephoto.com/c0/37/94/13/c0379413-800px-wm.jpg", rarity: "Rare", question: { question: "How did the telegraph change communication?", options: ["It replaced the printing press", "It was only used to send letters by mail", "It allow people to send messages faster over long distances", "It slowed down communication between cities"], answer: 2 } },
      { unit: 7, name: "Invisible Hand", description: "An idea by economist Adam Smith that says when people work for their own gain, it can help the whole economy. Businesses trying to make money can lead to more goods and services for everyone.", imageUrl: "https://bigthink.com/wp-content/uploads/2014/10/origin-166.jpg?w=480&h=270&crop=1", rarity: "Common", question: { question: "What does the invisible hand suggest about the economy?", options: ["Government should control all businesses", "People working for their own gain can benefit society", "Businesses should give up profits", "Workers should not compete for jobs"], answer: 1 } },
      { unit: 7, name: "Proletariat", description: "Term used by Karl Marx to describe the working-class people who do not own factories or land and must sell their labor to survive. During the Industrial Revolution, they often worked long hours in poor conditions.", imageUrl: "https://www.oerproject.com/-/media/WHP-Origins/HTML-Articles/Unit7/WHPOrigins-794-Article--Rise-of-the-Proletariat--7.jpg?h=1625&iar=0&w=2000&hash=4F6B7990EE4EA9A5556AF857EE35B37A", rarity: "Common", question: { question: "Who were the proletariat during the Industrial Revolution?", options: ["Working-class people who sold their labor", "Factory owners and wealthy businesspeople", "Government officials in charge of laws", "Farmers who owned large amounts of land"], answer: 0 } },
      { unit: 7, name: "Utilitarianism", description: "A philosophy that says the best actions are the ones that help the most people. During the Industrial Revolution, some reformers used it to argue for laws and policies that would improve working and living conditions.", imageUrl: "https://dwyermcnally.wordpress.com/wp-content/uploads/2016/02/utilitarianism.jpeg", rarity: "Rare", question: { question: "What is the main idea of utilitarianism?", options: ["Technology should replace humans", "Businesses should avoid paying workers", "Actions should help the most people", "Only the wealthy should make decisions"], answer: 2 } },
      { unit: 7, name: "Womens Suffrage", description: "The right of women to vote in elections. During the 19th and early 20th centuries, many women fought for this right, leading to changes in laws that allowed them to participate in government.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/9/92/Annie_Kenney_and_Christabel_Pankhurst_%28cropped%29.jpg", rarity: "Legendary", question: { question: "What was the goal of the women's suffrage movement?", options: ["To end all taxes for women", "To increase children's education", "To let women own factories", "To allow women to vote in elections"], answer: 3 } },

      // Unit 8 Cards
      { unit: 8, name: "Nation State", description: "A country where the people share a common national identity (same language, culture, and history) and live under their own independent government. Ideally, the political borders of the State match the cultural borders of the Nation.", imageUrl: "https://cdn.britannica.com/64/244164-131-C5EE8DAB/nation-flags-world-map.jpg", rarity: "Common", question: { question: "Which of these is the best example of a Nation-State concept?", options: ["A united Germany, where the government rules over a population that shares a German language and heritage", "The Austrian Empire, which ruled over Germans, Hungarians, Czechs, and Poles.", "A colony ruled by a distant king who speaks a different language.", "A city-state that only controls its own walls and immediate farmland."], answer: 0 } },
      { unit: 8, name: "The Congress of Vienna", description: "A series of meetings held by the major European powers (Britain, Austria, Prussia, and Russia) after the defeat of Napoleon. Their goal was to undo the changes of the French Revolution. They restored old kings to their thrones, redrew borders to create a Balance of Power so no single nation could dominate Europe again, and tried to suppress democracy and nationalism.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Berlin_.Gendarmenmarkt_.Deutscher_Dom_010.jpg/250px-Berlin_.Gendarmenmarkt_.Deutscher_Dom_010.jpg", rarity: "Rare", question: { question: "What was the primary goal of the conservatives at the Congress of Vienna?", options: ["To create a democratic European Union with a single currency", "To execute Napoleon and invade the United States", "To restore the old monarchies and establish a balance of power to prevent future wars", "To encourage revolutions and grant independence to all colonies"], answer: 2 } },
      { unit: 8, name: "The Young Turks", description: "Various groups in the early 20th century who were determined to modernize and secularize the crumbling Ottoman Empire. In 1908, they led a successful revolution against the absolute rule of Sultan Abdul Hamid II. They aimed to replace the monarchy with a constitutional government, improve the military, and promote a sense of Turkish Nationalism across the empire's diverse territories.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/1st_Young_Turk_Congress%2C_1902.jpg/330px-1st_Young_Turk_Congress%2C_1902.jpg", rarity: "Common", question: { question: "What was the primary goal of the Young Turks during their 1908 Revolution?", options: ["To modernize the empire", "To restore the Sultan", "To dissolve the Ottoman Empire", "To ban the use of the Turkish language"], answer: 0 } },
      { unit: 8, name: "Tsar Alexander II", description: "Known as the Tsar Liberator. After Russias defeat in the Crimean War, he realized that the country needed to modernize to remain a great power. His most significant act was the Emancipation Reform of 1861, which abolished serfdom and freed tens of millions of peasants. He also modernized the legal system and local government.", imageUrl: "https://historiamag.com/wp-content/uploads/2024/12/Alex-II-photo-colour.jpg", rarity: "Common", question: { question: "What was the most significant reform by Tsar Alexander II of Russia in 1861?", options: ["The creation of a communist government", "The decision to sell Alaska to the United States", "The ending of the Serfdom, freeing millions from forced labor", "The establishment of a national parliament called the Duma"], answer: 2 } },
      { unit: 8, name: "Matthew Perry", description: "A U.S. Naval officer who, in 1853, sailed a fleet of steam-powered warships into Tokyo Bay. He delivered a letter from the American President demanding that Japan end its 200-year-old policy of isolation and open its ports to trade.", imageUrl: "https://www.history.navy.mil/content/history/nhhc/get-involved/for-educators/lesson-plans/middle-school-lesson-plans/to-the-ends-of-the-earth/commodore-perry-and-japan/biography--matthew-calbraith-perry/_jcr_content/body/media_asset/image.img.jpg/1673449279477.jpg", rarity: "Common", question: { question: "What was the primary goal of Matthew Perry's expedition to Japan in 1853?", options: ["To offer Japan military protection against a Chinese invasion", "To colonize Japan and make it a territory of the United States", "To find a shortcut to the North Pole", "To force Japan to end its isolationist policy and open trade with the West"], answer: 3 } },
      { unit: 8, name: "Emperor Meiji", description: "The symbol of a new era in 1868 when a group of reformers overthrew the military Shogunate and restored power to the Emperor. Under his reign, known as the Meiji Restoration, Japan underwent modernization. In just a few decades, Japan industrialized its economy, built a modern navy, and transformed from an isolated island nation into a major global empire.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/d/de/Emperor_Meiji_by_Takahashi_Yuichi.jpg", rarity: "Common", question: { question: "What was the primary goal of the Meiji Restoration that began under Emperor Meiji?", options: ["To strengthen Japan by adopting European technology, military tactics, and industrialization", "To return Japan to a primitive, agricultural society and ban all technology", "To join the Chinese Empire as a province to protect against European invaders", "To make the Samurai the supreme rulers of the government forever"], answer: 0 } },
      { unit: 8, name: "Spheres of Influence", description: "A region within one country where another country claims exclusive rights to trade, invest, and build infrastructure (like railroads and mines).", imageUrl: "https://year9historydaniiellowe.wordpress.com/wp-content/uploads/2014/04/spheres_of_influence_new1.png", rarity: "Common", question: { question: "Which of the following best describes a Sphere of Influence during the Age of Imperialism?", options: ["A country that is completely conquered and ruled directly by a foreign governor", "A mutual defense treaty where two nations agree to protect each other", "A religious zone where only one type of worship is allowed", "An area in a country where an outsider country claims special privileges"], answer: 3 } },
      { unit: 8, name: "Imperialism", description: "The policy of a strong nation extending its power and influence over weaker countries or territories.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Punch_Rhodes_Colossus.png", rarity: "Legendary", question: { question: "Which of the following was a main economic motivation for European Imperialism in the late 19th century?", options: ["To find raw materials for factories and new markets to sell manufactured goods", "To learn new languages and cultural traditions from other continents", "To escape overcrowding in Europe by moving everyone to the colonies", "To import advanced technology from African and Asian nations"], answer: 0 } },
      { unit: 8, name: "Berlin Conference", description: "1884 to 1885, organized by Otto von Bismarck, was a meeting of 14 European nations (plus the USA) to lay down the rules for the Scramble for Africa, to prevent war between European powers over control of African territory.", imageUrl: "https://origins.osu.edu/sites/default/files/inline-images/Cartoon_depicting_Leopold_2_and_other_emperial_powers_at_Berlin_conference_1884.jpg", rarity: "Rare", question: { question: "What was the most significant outcome of the Berlin Conference of 1884-1885 regarding the continent of Africa?", options: ["It created a roadmap for African nations to gain independence by 1900", "It banned all European trade and colonization in Africa to protect local cultures", "It established rules for European powers to divide Africa among themselves without going to war", "It invited African kings and chiefs to vote on which European country they wanted to join"], answer: 2 } },
      { unit: 8, name: "Ethiopia", description: "While European powers conquered 90% of Africa, Ethiopia remained independent.The country modernized its army and stockpiled advanced weapons. In 1896, the Ethiopian army shocked the world by defeating the invading Italian forces.", imageUrl: "https://cdn.britannica.com/38/183638-050-EEF23553/World-Data-Locator-Map-Ethiopia.jpg", rarity: "Common", question: { question: "What was different about Ethiopia compared to nearly every other African nation during the Scramble for Africa in the late 19th century?", options: ["It successfully resisted European colonization by defeating the Italian army militarily", "It was the only nation to be colonized by the United States", "It voluntarily surrendered to the French to avoid war", "It was the first African colony to gain independence from Great Britain"], answer: 0 } },
      { unit: 8, name: "Taiping Rebellion", description: "A massive civil war in China that nearly destroyed the Qing Dynasty. Led by Hong Xiuquan, he came to believe he was the younger brother of Jesus Christ. He established the Heavenly Kingdom of Great Peace. The war caused an estimated 20 to 30 million deaths.", imageUrl: "https://www.goldenage.quest/cdn/shop/articles/1782d2_5d9a3647e79645ef9dc4d5315a3c6aee_mv2_393d7f30-4343-4e06-a513-a75931a06f5f.jpg?v=1758626513", rarity: "Common", question: { question: "What religious claim did the leader of the Taiping Rebellion, Hong Xiuquan, make?", options: ["He claimed he was the reincarnation of the Buddha", "He claimed to be the younger brother of Jesus Christ sent to save China.", "He claimed to be the rightful heir to the Ming Dynasty throne", "He claimed that Confucius had spoken to him in a dream"], answer: 1 } },
      { unit: 8, name: "Republic of China", description: "Established after the Xinhai Revolution overthrew the last emperor of the Qing Dynasty, ending over 2,000 years of imperial rule. The nation was founded on the ideals of Nationalism, Democracy, and Livelihood.", imageUrl: "https://cdn2.picryl.com/photo/2014/05/31/flag-of-republic-of-china19121928-ab131e-640.jpg", rarity: "Rare", question: { question: "Which Chinese Dynasty was overthrown to make way for the Republic of China?", options: ["Ming", "Qing", "Yuan", "Peoples Republic of China"], answer: 1 } },
      { unit: 8, name: "USS Maine", description: "A United States battleship sent to Havana Harbor, Cuba, in 1898. A massive explosion sank the ship, killing over 260 American sailors. Yellow Journalists immediately blamed Spain, using the slogan Remember the Maine! to inspire the American public into go to war against Spain.", imageUrl: "https://education.cfr.org/sites/default/files/styles/webp/public/images/image/2024/04/Cr_Explosion%20of%20USS%20Maine.jpg.webp?itok=jGlAhDtS", rarity: "Rare", question: { question: "How did the American press (Yellow Journalism) react to the explosion of the USS Maine in 1898?", options: ["They urged caution and waited for a full investigation before blaming anyone", "They claimed it was a plot by Cuban rebels to frame the United States", "They immediately blamed the Spanish government without evidence, demanding war.", "They ignored the event entirely to focus on domestic politics"], answer: 2 } },
      { unit: 8, name: "Monroe Doctrine", description: "A foreign policy that warned European nations that the American continents (North and South America) were closed to further European interference, stating that any attempt to control independent Latin American nations would be viewed as a hostile act against the United States.", imageUrl: "https://al-news.transforms.svdcdn.com/production/images/MonroeDoctrine.PNG?w=1200&h=630&q=82&auto=format&fit=crop&dm=1701713861&s=8c8e63c10dc0a4aac4762e4cc0af57d8", rarity: "Common", question: { question: "What was the primary warning issued to European powers by the United States and the Monroe Doctrine in 1823?", options: ["That they should not attempt to create new colonies or intervene in the affairs of the Western Hemisphere", "That they must immediately pay all debts owed to the United States.", "That they were required to adopt democracy and abolish their monarchies", "That the United States would now control all trade in the Atlantic Ocean"], answer: 0 } },
      { unit: 8, name: "Thailand", description: "Thailand (then known as Siam) was the only nation in the region to avoid European colonization. Squeezed between the British in Burma and the French in Indochina. The kings modernized the country, abolished slavery, and skillfully played the two European powers against each other by appearing more european.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5SOlmHdKlLfAsmNvtReTbXQB2JK56OYJMLQ&s", rarity: "Rare", question: { question: "How did the Kingdom of Siam (Thailand) successfully maintain its independence while all its neighbors were colonized by Britain and France?", options: ["By paying a massive annual tribute of gold to Queen Victoria", "By secretly joining the United States as a territory", "By defeating the European armies in a massive naval battle", "By modernizing its government and legal system to appear more European."], answer: 3 } },
      { unit: 8, name: "Hawaiian Coup (1893)", description: "The overthrow of the Kingdom of Hawaiis last monarch, Queen Lili uokalani. A group of American and European businessmen (the Committee of Safety) organized a rebellion and established the Republic of Hawaii", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/d/d0/USS_Boston_landing_force%2C_1893_%28PP-36-3-002%29.jpg", rarity: "Common", question: { question: "What is a Coup detat?", options: ["Overthrowing a government", "Launching a military invasion", "Investing into weapons", "Creating more factories"], answer: 0 } },

      // Unit 9 Cards
      { unit: 9, name: "Assassination of Archduke Franz Ferdinand", description: "The heir to the Austro-Hungarian throne, Archduke Franz Ferdinand, was shot and killed in Sarajevo, Bosnia. The assassin was Gavrilo Princip, a member of the Black Hand, a Serbian nationalist group. This event acted as the spark that set off World War I.", imageUrl: "https://d3i6fh83elv35t.cloudfront.net/newshour/app/uploads/2014/06/SARAJEWO_Attentat-901x1024.jpg", rarity: "Common", question: { question: "What was the primary motive of the assassin, Gavrilo Princip, in killing Archduke Franz Ferdinand?", options: ["To steal the Archdukes wealth and jewels.", "To protest the high taxes in the Austrian Empire.", "To free Serbians from Austrian rule and unite it with the country of Serbia.", "To start a war between the United States and Germany."], answer: 2 } },
      { unit: 9, name: "Triple Entente", description: "A military alliance between Great Britain, France, and Russia. It was formed in response to the growing power of Germany and its alliance (the Triple Alliance).", imageUrl: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgJUb3o6aBljVH2LcfHUFJiTq2JAr23QM-H5yH_aiVZOdGZxkMHw0vK8YTnNoWqCpg9FC5g2zxpZtGwR-Q1Nh9y-kNKZbkTUtSvkMjflOsxWr7uB17bm6y1_RfqBIQOPjI8EjcfWzaqJp4/s1600/roads_3e_4.jpg", rarity: "Common", question: { question: "Which major European power was NOT a member of the Triple Entente?", options: ["Great Britain", "France", "Russia", "Germany"], answer: 3 } },
      { unit: 9, name: "No Mans Land", description: "The deadly, barren space between opposing enemy trenches on the Western Front. It was filled with barbed wire, deep mud, shell craters, and the remains of fallen soldiers.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Battle_of_Bakhmut_1.jpg/250px-Battle_of_Bakhmut_1.jpg", rarity: "Rare", question: { question: "What made No Mans Land so dangerous for soldiers in WWI?", options: ["It was open ground protected by barbed wire and machine gun fire.", "It was the only place where soldiers could find fresh food.", "It was heavily forested, making it easy to get lost.", "It was filled with hidden gold mines that soldiers fought over."], answer: 0 } },
      { unit: 9, name: "Total War", description: "Total War is a conflict where nations devote all their resources-human, industrial, and financial-to the war effort. Governments took control of the economy, used propaganda to maintain support, and required women to work in factories to replace men at the front.", imageUrl: "https://us-static.z-dn.net/files/dec/05eef850b3531cf47993f6c346845c92.png", rarity: "Common", question: { question: "Which of the following is a key characteristic of Total War?", options: ["Only professional soldiers are involved in the conflict.", "Governments use rationing to save food and metal for the military.", "Armies agree to only fight during daylight hours.", "Private companies are allowed to ignore the war and trade with anyone."], answer: 1 } },
      { unit: 9, name: "Schlieffen Plan", description: "Germanys military strategy to avoid a two-front war. The goal was to knock France out of the war quickly by invading through neutral Belgium, then rushing the entire army east to fight Russia before they could fully mobilize. It failed because Belgium resisted more than expected and Russia mobilized faster than the Germans predicted.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Schlieffen_Plan.svg/960px-Schlieffen_Plan.svg.png?_=20101008142923", rarity: "Rare", question: { question: "What was the primary goal of the Schlieffen Plan", options: ["To invade Great Britain by sea.", "To sign a peace treaty with all European nations.", "To quickly defeat France before turning to fight Russia.", "To help Russia conquer the Ottoman Empire."], answer: 2 } },
      { unit: 9, name: "Eastern Front", description: "The massive stretch of land in Central and Eastern Europe where the Central Powers (Germany and Austria-Hungary) fought Russia. Unlike the stalemate and trenches of the Western Front, the Eastern Front was a war of movement across hundreds of miles. The Russian army suffered from a lack of supplies and modern weapons, leading to millions of casualties.", imageUrl: "https://cdn.britannica.com/71/64871-050-8548CA22/Eastern-Front-troops-Germany-Austria-Hungary-Turkey-Russia.jpg", rarity: "Common", question: { question: "What was a major difference between the Eastern Front and the Western Front during WWI", options: ["The Eastern Front involved much more movement, rather than a stalemate in trenches.", "Russia was much better equipped with modern tanks than Germany.", "The Eastern Front was fought entirely in the middle of the ocean.", "The Eastern Front was much smaller and more crowded."], answer: 0 } },
      { unit: 9, name: "February Revolution", description: "Began with mass protests in Petrograd (now St. Petersburg) over food shortages and the failures of WWI. Women, workers, and soldiers joined together, refusing to fire on the crowds. This forced Czar Nicholas II to give up the throne and replacing the monarchy with a weak Government.", imageUrl: "https://daily.jstor.org/wp-content/uploads/2017/02/Skobelev_square_during_the_February_revolution_1050x700.jpg", rarity: "Common", question: { question: "What was the immediate result of the February Revolution in Russia", options: ["The Bolsheviks took total control of the government.", "Russia immediately won World War I against Germany", "Czar Nicholas II stepped down and the monarchy ended.", "The United States sent troops to help the Czar stay in power."], answer: 2 } },
