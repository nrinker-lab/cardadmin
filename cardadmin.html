      { unit: 9, name: "Bolsheviks", description: "A radical Marxist political party led by Vladimir Lenin. During the 1917 October Revolution, they overthrew the weak Provisional Government. They gained support from workers and soldiers (Soviets) by promising to pull Russia out of World War I and eventually established the world's first Communist state.", imageUrl: "https://cdn.britannica.com/78/121178-050-95767572/crowd-Vladimir-Ilyich-Lenin-Russian-Revolution-1917.jpg", rarity: "Rare", question: { question: "What was the primary goal of the Bolsheviks during the 1917 October Revolution", options: ["To sell all of Russia's land to Germany in exchange for peace", "To overthrow the temporary Government and create a Communist country.", "To establish a democratic government based on the U.S. Constitution.", "To restore Czar Nicholas II to the throne and continue World War I."], answer: 1 } },
      { unit: 9, name: "Unrestricted Submarine Warfare", description: "A German naval policy where U-boats, submarines would sink any ship including merchant and passenger vessels-found in the waters around Great Britain without warning.The sinking of the Lusitania and other ships eventually drew the United States into the war", imageUrl: "https://cawarstudies.files.wordpress.com/2019/06/theday.jpg?w=556&h=412", rarity: "Common", question: { question: "Why did Germany use unrestricted submarine warfare during World War I?", options: ["To stop all weapons and merchant supplies from reaching Great Britain.", "To protect American passenger ships from British attacks.", "To explore the bottom of the Atlantic Ocean for oil.", "To transport German soldiers secretly to the United States."], answer: 0 } },
      { unit: 9, name: "Zimmermann Telegram", description: "A secret message sent in 1917 by Germany to Mexico. Germany proposed an alliance, promising to help Mexico reconquer lost territory in Texas, New Mexico, and Arizona if they attacked the United States. Finally pushed the United States to declare war on Germany.", imageUrl: "https://todayinhistory.blog/wp-content/uploads/2018/02/zimmerman-note.jpg", rarity: "Legendary", question: { question: "What was Germany's primary goal in sending the Zimmermann Telegram to Mexico", options: ["To keep the United States busy with a war on its own border.", "To invite Mexico to join the League of Nations.", "To help Mexico build a railroad to South America.", "To buy oil and cattle from Mexican farmers for the German army."], answer: 0 } },
      { unit: 9, name: "League of Nations", description: "An international organization created after World War I to maintain world peace. Proposed by U.S. President Woodrow Wilson in his Fourteen Points, its goal was to prevent future wars. However, the League was weak. It had no military to enforce its decisions.", imageUrl: "https://images.saymedia-content.com/.image/t_share/MTc2NDU3ODQyMjk3OTM5MTU3/the-strength-and-weaknesses-of-the-league-of-nations-an-essay.jpg", rarity: "Rare", question: { question: "What was the main reason the League of Nations ultimately failed to prevent World War II", options: ["It had too many powerful armies at its disposal.", "It was only open to nations located in North and South America.", "It did not include the United States and had no real army to enforce its rules.", "It required all member nations to switch to a single global currency."], answer: 2 } },
      { unit: 9, name: "Treaty of Versailles", description: "The peace agreement that officially ended World War I between Germany and the Allied Powers. It was famously harsh, forcing Germany to pay billions in reparations, significantly reduce its military, and give up large amounts of territory.", imageUrl: "https://worldhistorycommons.org/sites/default/files/treaty-of-versailles.jpg", rarity: "Common", question: { question: "The Treaty of Versailles forced Germany to do all of the following except", options: ["Unite with newly independent Austria", "Pay war reparations to the Allies", "Give up all its colonies and much of its land in Europe", "Reduce the size of their military"], answer: 0 } },
      { unit: 9, name: "Spanish Flu", description: "A devastating global pandemic that broke out during the final stages of World War I. Despite its name, it likely didnt start in Spain. It infected about one third of the world's population and killed an estimated 50 million people, more than the war itself.", imageUrl: "https://i.natgeofe.com/n/e055d988-159a-4198-873f-6d85d83eb782/Flu_Poster_SPL-N518-010_4x3.jpg", rarity: "Common", question: { question: "How did the total number of deaths from the Spanish Flu compare to the total number of deaths from World War I", options: ["The flu killed significantly more people than the war did.", "The war killed ten times as many people as the flu.", "The flu was only fatal to soldiers, while the war only killed civilians.", "Both the war and the flu resulted in zero civilian casualties."], answer: 0 } },
      { unit: 9, name: "Mandate System", description: "A way for the League of Nations to divide up the territories of the defeated German and Ottoman Empires after WWI. Instead of being granted independence, these regions (like Palestine, Iraq, and Syria) were put under the control of the winning Allied powers, mostly Britain and France.", imageUrl: "https://greatwarproject.org/wp-content/uploads/2019/03/cartoon3.jpg", rarity: "Rare", question: { question: "What was the official purpose of the Mandate System created after World War I", options: ["To have advanced nations govern territories until they were ready to rule themselves", "To give all former colonies immediate and total independence.", "To allow the United States to govern the entire Middle East.", "To return all captured lands to Germany and the Ottoman Empire."], answer: 0 } },
      { unit: 9, name: "Black Tuesday", description: "The day the U.S. Stock Market completely crashed. Investors panicked and sold off over 16 million shares in a single day, causing stock prices to collapse and billions of dollars to vanish. This event destroyed public confidence in the economy and is widely considered the official beginning of the Great Depression.", imageUrl: "https://m.media-amazon.com/images/I/51DNHRGWHFL._AC_UF1000,1000_QL80_.jpg", rarity: "Legendary", question: { question: "What was one of the most immediate effects of the Black Tuesday stock market crash on regular citizens", options: ["The government gave every citizen a $1,000 stimulus check.", "Thousands of banks failed, causing millions of people to lose their entire life savings.", "Every factory in the United States was forced to move to Europe.", "The price of gold dropped to zero, making jewelry worthless."], answer: 1 } },
      { unit: 9, name: "Hyperinflation", description: "Under the Treaty of Versailles, Germany was forced to pay war reparations to the Allies to cover the costs of the war. To pay this, Germany printed more money, which led to hyperinflation, where the German Mark became practically worthless.", imageUrl: "https://static01.nyt.com/images/2023/09/28/multimedia/27Ullrich-review-1-jzlg/27Ullrich-review-1-jzlg-videoSixteenByNine3000.jpg?year=2023&h=1687&w=3000&s=0f1aad6a2ce177fda9b1403ffda395c2b039b1e1d663f7c4a991ffebc38ba709&k=ZQJBKqZ0VN&tw=1", rarity: "Rare", question: { question: "What was a major economic effect of Germany trying to pay its massive war reparations after WWI", options: ["Germany became the wealthiest nation in Europe.", "The Allies decided to forgive the debt and give Germany extra gold.", "Germany used the money to build a massive new space program.", "There was so much German money printed that it became worthless"], answer: 3 } },

      // Unit 10 Cards
      { unit: 10, name: "Dictators", description: "After World War I, economic collapse and political chaos led to the rise of Totalitarian Dictators. These leaders gained absolute control by using propaganda, secret police, and the elimination of all political opposition. They promised to restore national pride and fix the economy, but they did so by stripping away individual rights and building up massive militaries.", imageUrl: "https://thumbs.dreamstime.com/b/close-up-portrait-girl-bandaged-eyes-human-suffering-blindness-person-blind-lost-uncertain-inequality-390272252.jpg", rarity: "Common", question: { question: "What is a defining characteristic of a Totalitarian Dictator?", options: ["They share power equally with a democratically elected parliament.", "They allow the press to criticize the government freely.", "They exercise total control over almost every aspect of public and private life.", "They are elected for a single one-year term and then must step down."], answer: 2 } },
      { unit: 10, name: "Fascism", description: "A far-right, authoritarian political system that emerged in Europe after WWI. It is characterized by extreme nationalism, a dictatorial leader, and the belief that the nation is more important than the individual. Fascists reject democracy and communism, instead using violence, censorship, and secret police to maintain absolute control over the state.", imageUrl: "https://m.media-amazon.com/images/I/61-9wcU3+0L._AC_UF1000,1000_QL80_.jpg", rarity: "Common", question: { question: "What kind of control did Fascist governments have over businesses?", options: ["They encouraged workers to go on strike to get higher pay.", "They completely dominated businesses and workers.", "They gave workers the power to vote on who should run their factories.", "They required all businesses to be owned and managed by the workers."], answer: 1 } },
      { unit: 10, name: "The Munich Agreement", description: "The most famous example of appeasement. Leaders from Britain and France met with Hitler and agreed to let Germany annex the Sudetenland (a portion of Czechoslovakia). They hoped that by giving Hitler what he wanted, they could avoid a second world war. British Prime Minister Neville Chamberlain famously returned home claiming he had secured peace for our time.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/M%C3%BCnchner_abkommen5_en.svg/1280px-M%C3%BCnchner_abkommen5_en.svg.png", rarity: "Rare", question: { question: "What was the primary goal of Britain and France in signing the Munich Agreement?", options: ["To prevent a new world war by giving in to Hitler's territorial demands.", "To form a military alliance with Germany to attack the Soviet Union.", "To help Czechoslovakia expand its borders into Germany.", "To force Hitler to step down as the leader of the Nazi Party."], answer: 0 } },
      { unit: 10, name: "Lebensraum", description: "Means living space, was a central part of Nazi ideology. Hitler argued that the German Aryan race was superior and needed more land to expand, grow food, and become a self-sufficient empire. This land was to be taken by force from Eastern Europe and the Soviet Union, where the local populations would be displaced, enslaved, or removed to make room for German settlers.", imageUrl: "https://encyclopedia.ushmm.org/images/large/9827558d-e389-45a6-ba75-b8c433770136.jpeg", rarity: "Common", question: { question: "How did the Nazi view of race justify the pursuit of Lebensraum?", options: ["They believed all races were equal and should share the land in Eastern Europe.", "They believed superior races had a biological right and duty to take land from inferior races", "They believed that moving to Russia would help Germans learn from other cultures.", "They wanted to help Slavic people develop their own independent countries."], answer: 1 } },
      { unit: 10, name: "Battle of Stalingrad", description: "The largest and bloodiest battle in human history and the ultimate turning point of World War II in Europe. Hitler wanted the city not just for its name, but to cut off Soviet supply lines and reach the oil fields in the Caucasus. The battle turned into brutal, house-to-house warfare, where the Soviet Red Army eventually surrounded and captured the entire German Sixth Army.", imageUrl: "https://cdn.britannica.com/65/239465-050-3BB893FD/Battle-of-Stalingrad.jpg", rarity: "Rare", question: { question: "Why is the Battle of Stalingrad considered a turning point in World War II?", options: ["It was the first time the German army used tanks in battle.", "It forced the United States to surrender and leave the war.", "It allowed Germany to finally capture all of the Soviet Union's oil fields.", "It resulted in a massive German defeat that forced them to retreat for the rest of the war."], answer: 3 } },
      { unit: 10, name: "D Day", description: "D Day (June 6, 1944), was the largest seaborne invasion in history. Codenamed Operation Overlord, it saw Allied forces from the United States, Britain, Canada, and other nations land on five beaches in Nazi occupied France. This massive operation opened a Second Front in Western Europe, forcing Germany to fight a two-front war and marking the beginning of the end for Hitler's Germany.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/a/a5/Into_the_Jaws_of_Death_23-0455M_edit.jpg", rarity: "Legendary", question: { question: "What did the D Day invasion successfully accomplish for the Allied powers?", options: ["It convinced Italy to switch sides and join the Allies.", "It opened a new front for the Allies into Western Europe.", "It resulted in the immediate capture of Adolf Hitler in his bunker.", "It allowed the Japanese navy to take control of the Atlantic Ocean."], answer: 1 } },
      { unit: 10, name: "Attack on Pearl Harbor", description: "On December 7, 1941, Japan launched a surprise aerial attack on the U.S. Naval Base at Pearl Harbor, Hawaii. Japan's goal was to destroy the U.S. Pacific Fleet so they could expand their empire in Asia without American interference. The attack sank or damaged 19 ships, including 8 battleships, and killed over 2,400 Americans. Instead of knocking the U.S. out of the way, caused the United States to officially enter World War II.", imageUrl: "https://i.natgeofe.com/n/b7dd695b-d6ae-412e-b4d3-b0441cd1bc25/AP_04120607713.jpg", rarity: "Rare", question: { question: "What was one of Japans motivations for attacking Pearl Harbor?", options: ["To strike back at the U.S. after a trade embargo was placed upon Japan.", "To conquer the Hawaiian Islands and make them a Japanese province.", "To protect the United States from a potential German invasion.", "To force the U.S. to buy more Japanese oil and steel."], answer: 0 } },
      { unit: 10, name: "Kamikaze Attacks", description: "Kamikaze was a desperate military tactic used by Japan toward the end of World War II. Japanese pilots would intentionally crash their planes, often loaded with explosives and extra fuel, into Allied warships. These suicide missions were designed to cause maximum damage to the U.S. Navy and were fueled by a death before dishonor code of loyalty to the Emperor.", imageUrl: "https://www.pbs.org/wgbh/americanexperience/media/filer_public_thumbnails/filer_public/85/9e/859ebf42-5b4c-41aa-9ccf-64220a3cad2e/pacific-chapman-w-kamikaze-4-ht-sep11-na.jpg__1000x793_q85_crop_subsampling-2_upscale.jpg", rarity: "Common", question: { question: "What was the primary goal of the Japanese Kamikaze pilots?", options: ["To parachute behind enemy lines and gather secret intelligence.", "To sink Allied ships by using their aircraft as guided missiles, leading to the death of the piolet.", "To test new aircraft engines for long-distance flight.", "To drop leaflets encouraging Allied sailors to surrender."], answer: 1 } },
      { unit: 10, name: "Rationing", description: "During World War II, the demand for supplies to support millions of soldiers created a massive shortage of goods at home. To ensure that everyone had enough to survive and that the military had what it needed to win, the government implemented rationing. Every person received ration books with stamps that limited how much of certain items they could buy each month.", imageUrl: "https://images.squarespace-cdn.com/content/v1/5829dc7ad482e98c45949d85/1607183670044-TYG4AQVXPVWYRIUQ2EAJ/Ration+poster+copyright+free.jpg", rarity: "Common", question: { question: "What was the primary purpose of rationing during the war?", options: ["To give citizens free groceries to reward them for their hard work.", "To track which citizens were secretly supporting the enemy.", "To replace paper money because the U.S. dollar had lost all its value.", "To ensure a fair distribution of goods so the military had enough supplies."], answer: 3 } },
      { unit: 10, name: "Japanese Internment Camps", description: "President Franklin D. Roosevelt signed Executive Order 9066. This authorized the forced removal of approximately 120,000 people of Japanese ancestry from their homes on the West Coast. They were sent to isolated internment camps in the interior of the country, based on the unfounded fear that they might be spies or saboteurs for Japan", imageUrl: "https://static01.nyt.com/images/2018/07/15/us/15manzanar1/merlin_23672947_f4a2e177-9998-449d-80b6-49d43856425c-superJumbo.jpg", rarity: "Common", question: { question: "What was the primary reason given by the U.S. government for the internment of Japanese Americans during WWII?", options: ["Concerns and the fear that they might assist the Japanese military.", "To provide them with better job opportunities in the center of the country.", "To protect them from the harsh winters on the West Coast.", "To train them as a special unit for the U.S. Army."], answer: 0 } },
      { unit: 10, name: "Kristallnacht", description: "The Night of Broken Glass, was a wave of anti-Jewish violence across Nazi Germany and Austria. Nazi leadership coordinated the destruction of over 7,000 Jewish-owned businesses and hundreds of synagogues.", imageUrl: "https://khc.qcc.cuny.edu/wp-content/uploads/2020/09/IMG_1528.jpg", rarity: "Common", question: { question: "What was a major turning point that occurred during Kristallnacht?", options: ["The Nazi party was outlawed by the German Supreme Court.", "The Jewish community was given government funds to rebuild their shops.", "It was the first time the Nazi regime permitted major violence against Jewish people.", "It was the night Germany officially declared war on the United States."], answer: 2 } },
      { unit: 10, name: "Genocide", description: "Genocide is the deliberate and systematic destruction of a racial, political, or cultural group. The United Nations made it an international crime to attempt to wipe out an entire group of people.", imageUrl: "https://m.media-amazon.com/images/I/91ms7+Zw6nL._AC_UF1000,1000_QL80_.jpg", rarity: "Common", question: { question: "What is the defining characteristic of Genocide?", options: ["Any conflict where two different countries go to war over territory.", "The intentional destruction of a specific group of people based on their identity.", "A government policy that raises taxes on a specific group of wealthy citizens.", "A natural disaster that causes a high number of casualties in a single city."], answer: 1 } },
      { unit: 10, name: "The Manhattan Project", description: "Top secret U.S. government research project during WWII that produced the first nuclear weapons. It involved over 130,000 people and cost nearly $2 billion (about $35 billion today). The project was a race against Nazi Germany to harness the power of nuclear fission to create a bomb so powerful it could end the war instantly.", imageUrl: "https://ahf.nuclearmuseum.org/wp-content/uploads/2017/03/Manhattan_Project_emblem_4.png", rarity: "Rare", question: { question: "What was the primary goal of the top secret Manhattan Project?", options: ["To develop a code breaking machine to crack German encryptions.", "To design a new fleet of high speed stealth submarines.", "To develop the worlds first atomic weapons.", "To map the entire Pacific Ocean for naval navigation."], answer: 2 } },
      { unit: 10, name: "Operation Downfall", description: "The proposed Allied plan for the full scale invasion of the Japanese home islands. The operation was cancelled after Japan surrendered following the atomic bombings and the Soviet entry into the war.", imageUrl: "https://i0.wp.com/the-past.com/wp-content/uploads/2025/05/post-1_image2-4.jpg?w=1230&ssl=1", rarity: "Rare", question: { question: "What was the main reason Allied planners were hesitant to carry out Operation Downfall?", options: ["They lacked enough ships to reach the Japanese coast.", "They feared the invasion would result in an extremely high number of casualties.", "They believed the Japanese military had already completely surrendered.", "They wanted to wait for the invention of the first jet-powered aircraft."], answer: 1 } },
      { unit: 10, name: "United Nations", description: "Established in 1945, immediately following the end of World War II. Its primary mission was to succeed where the League of Nations had failed: to prevent future world wars through international diplomacy and collective security. The UN was given the power to use military force to enforce its resolutions and maintain global peace.", imageUrl: "https://www.uri.org/sites/default/files/styles/teaser/public/media/images/2019/UN%20logo.png?h=4cdb5936", rarity: "Common", question: { question: "In what major way did the United Nations (UN) differ from the earlier League of Nations?", options: ["The UN was given the authority to use military force to keep the peace.", "The UN completely banned any country from having a military.", "The UN only allowed European countries to join as members.", "The UN was created specifically to help Germany win back its lost territories."], answer: 0 } },
      { unit: 10, name: "Cold War", description: "Emerged from the wreckage of World War II as the United States and the Soviet Union became global rivals. It was a struggle for global influence between Capitalism (USA) and Communism (USSR).", imageUrl: "https://m.media-amazon.com/images/M/MV5BZWViOGQ3ZTktNDk0Mi00YzNmLTkwMzYtZjdmZjg5MmJhNTczXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", rarity: "Rare", question: { question: "What was a primary cause of the Cold War between the United States and the Soviet Union?", options: ["A disagreement over which country should control the South Pole.", "A joint decision to ban all trade between North America and Europe.", "The Soviet Unions refusal to join the United Nations.", "Competing political and economic ideologies (Capitalism vs. Communism)."], answer: 3 } },

      // Unit 11 Cards
      { unit: 11, name: "Domino Theory", description: "A central part of U.S. foreign policy during the Cold War. It was the belief that if one country in a region fell to Communism, its neighbors would also fall one by one, just like a row of tipping dominoes.", imageUrl: "https://www.thisdayinquotes.com/wp-content/uploads/2024/03/1_the-origins-of-the-the-domino-effect.png", rarity: "Common", question: { question: "What was the primary goal of U.S. foreign policy based on the Domino Theory?", options: ["To encourage all countries in Asia to adopt a single common currency.", "To prevent the spread of Communism to neighboring countries.", "To help the Soviet Union build more factories in Eastern Europe.", "To ensure that every country in the world had a king or queen."], answer: 1 } },
      { unit: 11, name: "Marshall Plan", description: "A massive U.S. initiative to provide over $13 billion (about $150 billion today) in economic aid to help rebuild Western Europe after the devastation of WWII. The U.S. feared that poverty and hunger would make European citizens turn to Communism. By jump-starting their economies, the U.S. hoped to create stable, democratic allies and strong trading partners.", imageUrl: "https://diplomacy.state.gov/wp-content/uploads/2022/10/MarshallPlanPoster011-scaled-1-745x1024.jpg", rarity: "Rare", question: { question: "What was the primary political goal of the Marshall Plan?", options: ["To stop the spread of Communism by helping European countries rebuild their economies.", "To punish Germany by taking all of its industrial machinery.", "To force all European countries to join the United States as new states.", "To build a giant wall between Western Europe and the Soviet Union."], answer: 0 } },
      { unit: 11, name: "Iron Curtain", description: "Described the invisible barrier that divided Europe into two separate areas: the democratic nations of the West and the communist nations of the East controlled by the Soviet Union. It represented a complete cutoff of information, trade, and travel between the two sides.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTG4zLo-KbLhhv1xNNyTrv8nlE-9WxqHA2sAQ&s", rarity: "Rare", question: { question: "What did the Iron Curtain symbolize during the early years of the Cold War?", options: ["A massive trade agreement that united all of Europe under one currency.", "A secret defensive wall built by the United States to protect the borders of Alaska.", "The political division between Western democracies and Eastern communist states.", "The name of a new Soviet tank designed to invade Great Britain."], answer: 2 } },
      { unit: 11, name: "Warsaw Pact", description: "A military alliance formed by the Soviet Union and seven of its satellite nations in Eastern Europe. It was created as a direct response to the West forming NATO and allowing West Germany to rearm.", imageUrl: "https://www.sporcle.com/blog/wp-content/uploads/2019/05/3-58.jpg", rarity: "Common", question: { question: "What was the primary reason the Soviet Union created the Warsaw Pact?", options: ["To encourage free trade between the United States and Russia.", "To help the United Nations build a new headquarters in Moscow.", "To unite all European countries into a single democratic government.", "To provide a counter to the Western alliance known as NATO."], answer: 3 } },
      { unit: 11, name: "Mutually Assured Destruction", description: "Otherwise known as MAD, a military strategy and national security policy based on the idea that if two opposing sides-both had enough nuclear weapons to completely destroy each other, neither side would ever start a nuclear war. The logic was that if Country A attacked Country B, Country B would still have enough surviving missiles to launch a strike and wipe out Country A. In this scenario, there are no winners, only total global destruction.", imageUrl: "https://modelthinkers.com/storage/app/public/model_image/hMLFbTC5cL19XS3CsVSPtCXegj34Q3kQzP1uGwAQ.png", rarity: "Common", question: { question: "What was the primary goal of the strategy of Mutually Assured Destruction (MAD)?", options: ["To prevent nuclear war by making the cost of attacking so high that it would result in the total destruction of both sides.", "To encourage one country to launch a surprise nuclear attack before the other could react.", "To help the United States and the Soviet Union share their nuclear technology for peaceful energy use.", "To convince all countries in the world to voluntarily destroy their entire nuclear arsenals."], answer: 0 } },
      { unit: 11, name: "Space Race", description: "A high-stakes competition between the United States and the Soviet Union to prove which superpower had the best technology, military might, and political system. It began in 1957 when the Soviets shocked the world by launching Sputnik, the first artificial satellite. This sparked a race to the stars that pushed both nations to develop massive rockets, leading eventually to the ultimate goal: putting a human on the moon.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Portrait_of_ASTP_crews.jpg/250px-Portrait_of_ASTP_crews.jpg", rarity: "Rare", question: { question: "What was the primary political goal of the Space Race for both the U.S. and the USSR?", options: ["To find a new planet for humans to move to immediately.", "To prove their country had superior science, technology, and government power.", "To build a giant mirror in space to control the Earth's weather.", "To find alien life and sign a peace treaty with them."], answer: 1 } },
      { unit: 11, name: "Long March", description: "A massive military retreat by the Chinese Communist Party (CCP) to escape the encircling armies of the Chinese Nationalist Party (Kuomintang). Led by Mao Zedong, around 100,000 communists traveled over 6,000 miles across some of the most dangerous mountains and rivers in China. By the time they reached safety in the north, only about 8,000 to 10,000 people had survived.", imageUrl: "https://p1.img.cctvpic.com/photoworkspace/contentimg/2016/10/21/2016102114502673562.png", rarity: "Rare", question: { question: "What was the most significant political result of the Long March for the Chinese Communist Party?", options: ["It resulted in the immediate surrender of the Nationalist government.", "It allowed the Communists to capture the capital city of Nanjing.", "It inspired many Chinese to join the Communist Party.", "It forced Japan to leave Chinese territory and go back to Tokyo."], answer: 2 } },
      { unit: 11, name: "Fidel Castro", description: "A revolutionary leader who transformed Cuba into the first communist state in the Western Hemisphere. Overthrew the U.S.-backed dictator in 1959, Castro aligned Cuba with the Soviet Union. This move brought the Cold War directly to America's doorstep, leading to decades of tension, trade embargoes, and several moments where the world nearly faced nuclear war.", imageUrl: "https://www.thoughtco.com/thmb/B86l4KxEfhucGdOp7ncwLU1kkEU=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/FidelCastro-898286eb764441678e15b143c2cc2357.jpg", rarity: "Common", question: { question: "What was a major consequence of Fidel Castro's rise to power in Cuba?", options: ["Cuba became a close military and economic ally of the United States.", "Cuba transitioned into a democratic government with free elections every four years.", "Cuba decided to remain completely neutral and refused to talk to any other countries.", "Cuba became a communist nation and a key ally of the Soviet Union during the Cold War."], answer: 3 } },
      { unit: 11, name: "Cultural Revolution", description: "A social and political movement launched by Mao Zedong to reassert his authority over the Chinese government. He called on the youth of China, the Red Guards, to destroy the Old Customs, Old Culture, Old Habits, and Old Ideas, and attack anyone seen as an enemy of the revolution.", imageUrl: "https://upload.wikimedia.org/wikipedia/en/c/c6/Cultural_Revolution_poster.jpg", rarity: "Common", question: { question: "Who were the Red Guards during the Cultural Revolution?", options: ["Groups of students and young people who enforced Mao's revolutionary ideas.", "A group of high-ranking generals who ran the Chinese economy.", "A secret unit of Japanese spies who tried to sabotage the Chinese government.", "A collection of foreign diplomats who moved to China to help build factories."], answer: 0 } },
      { unit: 11, name: "Deng Xiaoping", description: "Became the leader of China and steered the country in a completely different direction. He cared more about economic results than strict Communist theory. He opened China to foreign investment and private business, transforming it into a global economic powerhouse.", imageUrl: "https://cdn.britannica.com/80/193880-050-5C7817E3/Deng-Xiaoping-1978.jpg", rarity: "Common", question: { question: "What did Deng Xiaoping do differently than Mao Zedong while ruling China?", options: ["He returned China to an ancient system of kings and emperors.", "He strengthened China's economy by incorporating elements of capitalism and modern technology.", "He pushed to ban all foreign trade and make China completely isolated from the world.", "He wanted to move the entire population of China into newly built underground cities."], answer: 1 } },
      { unit: 11, name: "Iranian Revolution", description: "A massive social and political uprising that transformed Iran from a pro-Western monarchy into an Islamic Republic. The revolution overthrew the Shah (King) Mohammad Reza Pahlavi, who was backed by the United States, and replaced him with the religious leader Ayatollah Khomeini. This event shifted Irans government to a theocracy, where Islamic law (Sharia) became the basis for the country's legal and political system.", imageUrl: "https://gdb.rferl.org/57f9b7f7-f343-43bf-bd40-a0c0149feaa0_cx0_cy6_cw0_w408_r1_s.jpg", rarity: "Rare", question: { question: "What was a major outcome of the 1979 Iranian Revolution?", options: ["Iran became a democratic nation with a president elected by the United States.", "Iran decided to join the Soviet Union as a communist satellite state.", "The Shah was overthrown and replaced by a religious government led by Ayatollah Khomeini.", "The Iranian government abolished all religions and became a secular state."], answer: 2 } },
      { unit: 11, name: "Afghanistan", description: "Also called the Graveyard of Empires, It refers to the historical pattern where great world powers-including the British Empire, the Soviet Union, and the United States-invaded Afghanistan with superior military force but were ultimately unable to maintain control.", imageUrl: "https://historyatelier.com/post/afghanistan-is-it-really-a-graveyard-of-empires/cavebleed.jpg", rarity: "Common", question: { question: "Which Cold War superpower suffered a major military and political defeat in Afghanistan during the 1980s?", options: ["The United Kingdom", "Communist China", "The Republic of France", "The Soviet Union"], answer: 3 } },

      // Unit 12 Cards
      { unit: 12, name: "Mahatma Gandhi", description: "The leader of the Indian independence movement against British rule. Gandhi believed that by refusing to cooperate with unjust laws without using violence, a people could reveal the moral wrongness of an empire and eventually win their freedom.", imageUrl: "https://www.factinate.com/storage/app/media/factinate/2025/5/5/Gandhi%20msn.jpg", rarity: "Rare", question: { question: "What was Gandhi's primary method for achieving political change and independence?", options: ["Organizing a large, secret army to launch a surprise attack on British bases.", "Encouraging Indian citizens to move to other countries to weaken the British economy.", "Using nonviolent protests, such as boycotts and hunger strikes, to challenge British authority.", "Partnering with the Soviet Union to bring a communist revolution to India."], answer: 2 } },
      { unit: 12, name: "Partition of India", description: "The process of dividing the Indian subcontinent into two independent nations at the end of British rule: India (with a Hindu majority) and Pakistan (with a Muslim majority). The hastily drawn borders led to one of the largest and most violent mass migrations in human history.", imageUrl: "https://media.newyorker.com/photos/59096e742179605b11ad743a/master/pass/150629_r26683.jpg", rarity: "Common", question: { question: "What was a major consequence of the Partition of India in 1947?", options: ["Approximately 200k to 2 million people were killed during the largest movement of people in history.", "India and Pakistan agreed to share a single capital city and military.", "The subcontinent was unified into one massive democratic country.", "The British decided to stay for another fifty years to ensure the transition was peaceful."], answer: 0 } },
      { unit: 12, name: "Zionism", description: "The nationalist movement that emerged in the late 19th century supporting the establishment of a homeland for the Jewish people This eventually led to the 1948 creation of the modern State of Israel.", imageUrl: "https://www.cjh.org/zionism/images/LOC-Build_the_Jewish_homeland.jpg", rarity: "Common", question: { question: "What was the primary goal of the Zionist movement?", options: ["To encourage Jewish people to settle in various countries across Western Europe.", "To create a Jewish country in the land of Israel for Jews.", "To establish a global trade network controlled by religious leaders.", "To ban the practice of any other religions within the city of Jerusalem."], answer: 1 } },
      { unit: 12, name: "Nakba", description: "Means Catastrophe in Arabic, refers to the mass displacement and of Palestinians during the 1948 Arab-Israeli War. Approximately 700,000 Palestinians fled or were expelled from their homes, and hundreds of Palestinian villages were destroyed or depopulated. This event represents the beginning of a refugee crisis that continues in the region today.", imageUrl: "https://www.mezan.org/public/assets/uploads/media-uploader/16526041681807.jpg", rarity: "Common", question: { question: "What does the term Nakba represent in Palestinian history?", options: ["The discovery of major oil reserves that led to sudden national wealth.", "The celebration of a new democratic government in the region.", "The signing of a permanent peace treaty between all Middle Eastern nations.", "The fleeing for hundreds of thousands of Arabs from Palestine in 1948."], answer: 3 } },
      { unit: 12, name: "Negritude", description: "A literary and ideological movement developed in the 1930s by  African and Caribbean intellectuals. The movement was a protest against French colonial rule. It aimed to celebrate Blackness, reclaim African heritage, and reject the idea that European culture was superior to African culture.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCw3mjTfWy0Cu4NCxcbggP8mdufWFtkt3Tew&s", rarity: "Rare", question: { question: "What was the primary purpose of the Negritude movement?", options: ["To encourage all African nations to adopt French as their only official language.", "To promote the idea that African people should completely forget their history and modernize.", "To celebrate African identity and culture while rejecting colonial stereotypes and European superiority.", "To create a new military alliance between Caribbean islands and the Soviet Union."], answer: 2 } },
      { unit: 12, name: "Cold War in Africa", description: "In the global struggle between the United States and the Soviet Union, as European empires collapsed, the two superpowers competed for influence, resources, and military bases. This often turned local struggles for independence into violent proxy wars, where the U.S. supported anti-communist groups and the Soviets supported socialist revolutionaries.", imageUrl: "https://i.ytimg.com/vi/YcD8Mv7ZwTk/hqdefault.jpg", rarity: "Common", question: { question: "What was a major consequence of the Cold War Proxy Wars in newly created African nations?", options: ["The immediate end of all tribal and ethnic tensions.", "Local conflicts were intensified and prolonged by foreign influence.", "The superpowers provided unlimited funding for schools and hospitals without any strings attached.", "All African nations decided to stop trading with both the U.S. and the Soviet Union."], answer: 1 } },
      { unit: 12, name: "Apartheid", description: "A system of institutionalized racial segregation and discrimination in South Africa from 1948 until the early 1990s. The white minority government enforced strict laws that classified all citizens into racial groups. Black South Africans were stripped of their citizenship, forced to live in segregated homelands.", imageUrl: "https://www.museodelapaz.eus/wp-content/uploads/2024/12/APARTHEIDa-scaled.jpg", rarity: "Legendary", question: { question: "What was the primary goal of the Apartheid system in South Africa?", options: ["To create a diverse government where all racial groups shared equal power.", "To maintain white minority rule and keep different racial groups physically and socially separate.", "To encourage all citizens to move to other countries to reduce the population.", "To build a unified national culture based on a single shared language."], answer: 1 } },
      { unit: 12, name: "Nelson Mandela", description: "The primary leader of the movement to end Apartheid in South Africa. Lead the the African National Congress (ANC), he was arrested and spent 27 years in prison. He became a global symbol of resistance against racial injustice. He was elected South Africa's first Black president in its first fully representative democratic election.", imageUrl: "https://gcp-na-images.contentstack.com/v3/assets/bltea6093859af6183b/bltbd0e6a106315f8d2/698a10668fd2ee70b736189b/nelson-mandela.jpg?branch=production", rarity: "Common", question: { question: "Who was elected the first president of South Africa in 1994", options: ["Mahatma Gandhi", "Marcus Garvey", "W.E.B. Du Bois", "Nelson Mandela"], answer: 3 } },
      { unit: 12, name: "North Korea", description: "The Kims have ruled the Democratic People's Republic of Korea (DPRK) since its founding in 1948. The family line consists of three generations: Kim Il sung, Kim Jong il and, Kim Jong un. The family maintains absolute control through a massive personality cult and a powerful military first policy.", imageUrl: "https://media.cnn.com/api/v1/images/stellar/prod/180531164405-20180531-kim-family-tease-graphic.jpg?q=w_1920,h_1080,x_0,y_0,c_fill", rarity: "Common", question: { question: "What is a primary way the Kims maintain absolute authority over the North Korean population?", options: ["By holding competitive, multi party elections every four years.", "By oppressing political opponents and holding a god like position.", "By encouraging citizens to travel abroad and learn about different government systems.", "By allowing private companies to own all of the country's news and media outlets."], answer: 1 } },
      { unit: 12, name: "South Korea", description: "A global leader in technology, culture, and industry, often cited as one of the greatest economic success stories of the 20th century. Post Korean War, South Korea and North Korea had similar economies, it wasn't until the 1980s where South Korea began to economically surpass their northern neighbors.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/South_Korea_-_Location_Map_%282013%29_-_KOR_-_UNOCHA.svg/960px-South_Korea_-_Location_Map_%282013%29_-_KOR_-_UNOCHA.svg.png", rarity: "Common", question: { question: "Directly after the Korean War, what kind of government system did South Korea have?", options: ["Presidental Republic", "Authoritarian Regime", "One Party Communist Republic", "Theocracy"], answer: 2 } },
      { unit: 12, name: "Ho Chi Minh", description: "The revolutionary leader who led the struggle for Vietnamese independence from French colonial rule and later served as the President of North Vietnam. Communist and nationalist who founded the Viet Minh to fight for a unified, independent Vietnam.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShg_ODYZzURPWZBa81KNO_ZVE0ue8rXsp9iQ&s", rarity: "Common", question: { question: "What was Ho Chi Minhs primary goal for the country of Vietnam?", options: ["To unify the North and South into a single, independent communist nation.", "To keep Vietnam as a permanent colony of the French Empire.", "To encourage Vietnam to become the 51st state of the United States.", "To ban all forms of agriculture and turn the country into one giant city."], answer: 0 } },
      { unit: 12, name: "Geneva Accords", description: "A set of agreements intended to settle the conflict in Indochina. The most significant outcome was the temporary division of Vietnam along the 17th Parallel, creating a communist North under Ho Chi Minh and a pro Western South. Meant to be a short term fix until national elections could be held, this division effectively set the stage for the Vietnam War.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/c/ca/1954_Geneva_Conference.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original", rarity: "Rare", question: { question: "What was the immediate physical result of the Geneva Accords in 1954?", options: ["Vietnam was temporarily divided into North and South at the 17th Parallel.", "Vietnam was completely unified under a single democratic government.", "Vietnam became a permanent colony of the United States.", "The French military was granted permanent control over the city of Hanoi."], answer: 0 } },
      { unit: 12, name: "Mikhail Gorbachev", description: "The final leader of the Soviet Union (USSR), coming to power in 1985. He introduced two revolutionary policies: Glasnost, which allowed for more freedom of speech and press, and Perestroika, which aimed to modernize the economy. He hoped to save the USSR, his reforms instead triggered a wave of independence movements that led to the collapse of the Soviet Union in 1991.", imageUrl: "https://compote.slate.com/images/c0dfa79d-2e45-46b2-abcc-9f7db3146068.jpeg", rarity: "Rare", question: { question: "What was the primary goal of Gorbachevs policy of Glasnost?", options: ["To build a physical wall around the entire Soviet Union to keep people in.", "To ban the use of any language other than Russian within the Soviet borders.", "To immediately declare war on the United States and NATO.", "To encourage social and political transparency by allowing more freedom of information."], answer: 3 } },
      { unit: 12, name: "Fall of the Berlin Wall", description: "On November 9, 1989, was the most iconic symbol of the end of the Cold War. For nearly 30 years, the wall had physically and ideologically divided the city into democratic West Berlin and communist East Berlin. Following months of massive protests in East Germany, thousands of people rushed the border crossings. Guards, overwhelmed by the crowd, opened the gates, and East and West Berliners celebrated together atop the wall.", imageUrl: "https://www.pewresearch.org/wp-content/uploads/sites/20/2014/10/FT_14.10.15_berlinWallPhoto.jpg", rarity: "Rare", question: { question: "Which event most directly led to the opening of the Berlin Wall?", options: ["A surprise military invasion by the United States and NATO forces.", "Massive peaceful protests by East Germans.", "The Soviet Union decided to trade the city of Berlin for a piece of territory in Alaska.", "The wall was destroyed by a massive earthquake that struck Central Europe."], answer: 1 } },

      // Unit 13 Cards
      { unit: 13, name: "Yugoslavia", description: "Was a country in Southeast Europe that existed for most of the 20th century. Yugoslavia was a socialist state but remained independent of the Soviet Union. Internal ethnic tensions and economic problems grew, eventually leading to a series of violent civil wars in the 1990s that broke the nation apart into several independent countries.", imageUrl: "https://preview.redd.it/timeline-of-the-breakup-of-yugoslavia-v0-1j77v7fav87f1.jpeg?auto=webp&s=ec69b37c6e18bfa3f43577b0cdaeaab7eb9baf64", rarity: "Common", question: { question: "What happened to Yugoslavia in the 1990s", options: ["It was a monarchy that completely banned all forms of socialism.", "It broke apart into smaller ethnic countries.", "It was the only country in Europe that refused to trade with any other nations.", "It absorbed neighboring enclaves."], answer: 1 } },
      { unit: 13, name: "European Union", description: "A political and economic union between 27 European countries. Has evolved into a massive single market where people, goods, services, and money can move across borders easily. Most members also share a common currency.", imageUrl: "https://www.econlib.org/wp-content/uploads/2016/10/closerunion.jpg", rarity: "Rare", question: { question: "What is one of the primary features of the European Union.", options: ["Each member country must have its own unique currency and trade laws.", "The EU acts as a single military force that replaces the armies of all member states.", "All member countries are required to speak the same official language by 2030.", "Most members of the EU share a common currency."], answer: 3 } },
      { unit: 13, name: "ISIS", description: "the Islamic State of Iraq and Syria is a militant extremist group that follow a radical interpretation of Islamism. They became known for their use of social media for recruitment and for carrying out brutal acts of violence and terrorist attacks worldwide.", imageUrl: "https://m.media-amazon.com/images/I/716iYsctoML._AC_UF1000,1000_QL80_.jpg", rarity: "Common", question: { question: "What was a major factor that allowed ISIS to rapidly gain territory in Iraq and Syria?", options: ["They took advantage of instability in the region to seize power.", "They were a peaceful political party that won a series of democratic elections.", "They were invited by the United Nations to help govern the region.", "They focused entirely on building high tech cities and ignored military expansion."], answer: 0 } },
      { unit: 13, name: "Arab Spring", description: "A series of anti government protests, uprisings, and armed rebellions that spread across much of the Arab world in the early 2010s. Sparked a wave of demonstrations fueled by economic stagnation, political repression, and human rights violations. Protesters demanded the removal of long term dictators and a shift toward democracy.", imageUrl: "https://media.npr.org/assets/img/2011/12/17/tunisia_custom-35d572bf67a3883025a98c4376fada55a58950fb.jpg", rarity: "Legendary", question: { question: "What role did social media play during the Arab Spring?", options: ["It was used by governments to completely block all communication between citizens.", "It was the primary way that protesters purchased military-grade weapons from foreign countries.", "It was used by the United Nations to cast official votes for new presidents in the region.", "It allowed protesters to organize and share information with the global community."], answer: 3 } },
      { unit: 13, name: "ASEAN", description: "Association of Southeast Asian Nations is a regional intergovernmental organization comprising ten countries in Southeast Asia. Established in 1967, its primary goals are to promote economic growth, social progress, and cultural development, while also ensuring regional peace and stability.", imageUrl: "https://images.squarespace-cdn.com/content/v1/5cecd9c1f824ce00010c16c0/1576224795044-5BVDTDF88IBWCCQPXB7D/logo-asean.png", rarity: "Common", question: { question: "What is the main characteristic of ASEAN?", options: ["Member states frequently vote to impose strict economic sanctions on one another.", "The organization maintains a massive unified military force.", "The member countries work together to further economic and political goals.", "All member states must adopt a single currency and a single official language."], answer: 2 } },
      { unit: 13, name: "Aging of Japan", description: "A demographic crisis characterized by an older society and a rapidly shrinking population. As the older generation ages, there are fewer young workers to support the economy, pay into the pension system, and care for the elderly, creating a massive social and economic challenge.", imageUrl: "https://static.independent.co.uk/s3fs-public/thumbnails/image/2015/07/19/09/japan-old.jpg?width=1200", rarity: "Common", question: { question: "What is a major economic challenge caused by Japans current age crisis.", options: ["A massive surplus of young workers competing for too few jobs.", "A sudden lack of housing because the population is growing too fast.", "The government is forced to ban all technology to save money for healthcare.", "A shrinking workforce that must support a growing elderly population."], answer: 3 } },
      { unit: 13, name: "African Union", description: "An organization of all 55 countries on the African continent. Its mission shifted from simply ending colonialism to achieving greater unity and solidarity between African nations. The AU works to promote economic integration, peace, and security across the continent.", imageUrl: "https://upload.wikimedia.org/wikipedia/commons/5/51/Flag_of_the_African_Union.svg", rarity: "Rare", question: { question: "What is one of the main sayings of the African Union?", options: ["African expansion is a must", "The sun never sets in the fatherland", "African solutions for African problems", "Democracy and Decolonializm"], answer: 2 } },
      { unit: 13, name: "Juvenal Habyarimana", description: "The President of Rwanda from 1973 until 1994. A member of the Hutu ethnic group, he limited the participation of the Tutsi minority in government and education. His death ignited one of the darkest chapters in modern history, the Rwandan Genocide.", imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSI6_TnthjFAeJh3NnmOjCwfEkHisnYQf28Xg&s", rarity: "Common", question: { question: "What specific event involving the president of Rwanda is considered the immediate trigger for the 1994 Rwandan Genocide?", options: ["The shooting down of his airplane and his death.", "His decision to step down voluntarily and move to Belgium.", "The signing of a peace treaty that gave equal power to all ethnic groups.", "His appearance on a popular television show to promote national unity."], answer: 0 } },
      { unit: 13, name: "BRICS", description: "An acronym for a powerful group of emerging economies that originally included Brazil, Russia, India, China, and South Africa. Formed to give these nations a greater voice in global economics. BRICS is often seen as a counter the G7, focusing on shifting the balance of global economic power away from the USA and the West.", imageUrl: "https://cebri.org/revista/media/artigos/vieira_final_mesmo685d592fe5865.png", rarity: "Common", question: { question: "What is one of the primary goals of the BRICS nations in the global economy?", options: ["To merge all five countries into a single nation with one capital city.", "To ensure that the U.S. Dollar remains the only currency used for global trade.", "To ban the use of technology and return to a strictly agrarian trade system.", "To increase their influence in global economics and trade."], answer: 3 } },
      { unit: 13, name: "Democratization", description: "Process by which a political regime transitions from an authoritarian system to a more democratic one. Involves the establishment of free and fair elections, the protection of civil liberties, and the creation of a constitution that limits the power of the government.", imageUrl: "https://adrtimes.com/wp-content/uploads/2024/07/What-Is-Democratization-1024x576.jpg", rarity: "Rare", question: { question: "What is generally considered the main goal of the democratization process?", options: ["The government seizing control of all private businesses and newspapers.", "The people using their vote to peacefully elect new leaders to office.", "A single leader declaring themselves President for Life to ensure stability.", "The banning of all protests and public gatherings to maintain order."], answer: 1 } }
    ];

    // ===================================================================================
    // APPLICATION ENGINE LOGIC
    // ===================================================================================

    const passwordsByUnitMap = {};
    for (const [password, unitId] of Object.entries(passwordsByUnit)) {
        if (!passwordsByUnitMap[unitId]) passwordsByUnitMap[unitId] = [];
        passwordsByUnitMap[unitId].push(password);
    }

    const passwordUnitSelect = document.getElementById('passwordUnitSelect');
    const cardUnitFilter = document.getElementById('cardUnitFilter');
    
    const defaultCardOpt = document.createElement('option');
    defaultCardOpt.value = "";
    defaultCardOpt.textContent = "-- Choose a Unit to Load Cards --";
    cardUnitFilter.appendChild(defaultCardOpt);

    const totalUnits = Math.max(...Object.values(passwordsByUnit));
    for (let i = 1; i <= totalUnits; i++) {
        const uName = unitNames[i] || `Unit ${i}`;
        
        const passOption = document.createElement('option');
        passOption.value = i;
        passOption.textContent = uName;
        passwordUnitSelect.appendChild(passOption);

        const cardOption = document.createElement('option');
        cardOption.value = i;
        cardOption.textContent = uName;
        cardUnitFilter.appendChild(cardOption);
    }

    let currentActiveUnit = null;
    let currentPasswordIndex = 0;

    // Trigger update if unit changes while the display is active
    passwordUnitSelect.addEventListener('change', function() {
        if (document.getElementById('passwordDisplayArea').style.display === 'flex') {
            startPasswordSequence();
        }
    });

    function startPasswordSequence() {
        currentActiveUnit = parseInt(document.getElementById('passwordUnitSelect').value);
        currentPasswordIndex = 0;
        updatePasswordUI();
    }

    function hidePasswords() {
        document.getElementById('passwordDisplayArea').style.display = 'none';
        currentActiveUnit = null;
    }

    function navigatePassword(direction) {
        if (!currentActiveUnit) return;
        const totalPasswords = passwordsByUnitMap[currentActiveUnit].length;
        currentPasswordIndex += direction;
        
        if (currentPasswordIndex < 0) currentPasswordIndex = totalPasswords - 1;
        if (currentPasswordIndex >= totalPasswords) currentPasswordIndex = 0;
        
        updatePasswordUI();
    }

    function updatePasswordUI() {
        const passwordArray = passwordsByUnitMap[currentActiveUnit];
        document.getElementById('passwordDisplayArea').style.display = 'flex';
        document.getElementById('passwordCounter').innerText = `Password ${currentPasswordIndex + 1} of ${passwordArray.length}`;
        document.getElementById('currentPassword').innerText = passwordArray[currentPasswordIndex];
    }

    const adminCardGrid = document.getElementById('adminCardGrid');

    function filterCardsByUnit() {
        const selectedUnitValue = document.getElementById('cardUnitFilter').value;
        adminCardGrid.innerHTML = '';

        if (selectedUnitValue === "") {
            adminCardGrid.innerHTML = `<div class="empty-message">Please select a historical unit above to display its corresponding card database.</div>`;
            return;
        }

        const selectedUnitId = parseInt(selectedUnitValue, 10);
        const targetCards = cards.filter(card => card.unit === selectedUnitId);

        // Sort cards by rarity: Legendary > Rare > Common
        targetCards.sort((a, b) => {
            const valA = pointValues[a.rarity] || 0;
            const valB = pointValues[b.rarity] || 0;
            return valB - valA; // Descending order
        });

        if (targetCards.length === 0) {
            adminCardGrid.innerHTML = `<div class="empty-message">No cards configured inside database for this unit yet.</div>`;
            return;
        }

        targetCards.forEach((card) => {
            const cardContainer = document.createElement('div');
            cardContainer.className = 'card-container';
            cardContainer.onclick = function() { this.classList.toggle('flipped'); };

            let optionsHTML = '';
            card.question.options.forEach((opt, idx) => {
                if (idx === card.question.answer) {
                    optionsHTML += `<div class="correct-answer">✓ ${opt}</div>`;
                } else {
                    optionsHTML += `<div class="wrong-answer">✗ ${opt}</div>`;
                }
            });

            const pts = pointValues[card.rarity] || 0;
            const uColor = unitColors[card.unit] || "#333";
            const rColor = rarityColors[card.rarity] || "#333";

            cardContainer.innerHTML = `
                <div class="card-inner">
                    <div class="card-front" style="border-color: ${rColor};">
                        <div class="card-header-labels">
                            <span class="unit-badge" style="background-color: ${uColor};">Unit ${card.unit}</span>
                            <span class="rarity-badge" style="background-color: ${rColor};">${card.rarity}</span>
                        </div>
                        <img src="${card.imageUrl}" alt="${card.name}">
                        <h3 style="margin: 5px 0;">${card.name}</h3>
                        <p>${card.description}</p>
                        <div class="points-badge">${pts} Points</div>
                    </div>
                    
                    <div class="card-back">
                        <h3 style="color: #f1c40f; margin-top: 0;">Challenge Key</h3>
                        <p style="font-weight: bold; font-size: 0.95em; margin-bottom: 15px;">${card.question.question}</p>
                        <div style="text-align: left; width: 100%;">
                            ${optionsHTML}
                        </div>
                    </div>
                </div>
            `;
            adminCardGrid.appendChild(cardContainer);
        });
    }

    filterCardsByUnit();
    </script>
</body>
</html>
